/* ---------------------------------------------------------------------------
   Impostazioni locali (piccole preferenze, localStorage protetto da try/catch)
--------------------------------------------------------------------------- */
const Prefs = {
  _mem: {},
  get(k, d) {
    try { const v = localStorage.getItem('engimedit:' + k); return v === null ? (k in this._mem ? this._mem[k] : d) : JSON.parse(v); }
    catch { return k in this._mem ? this._mem[k] : d; }
  },
  set(k, v) {
    this._mem[k] = v;
    try { localStorage.setItem('engimedit:' + k, JSON.stringify(v)); } catch { /* memoria piena o non disponibile: resta in RAM */ }
  },
  del(k) { delete this._mem[k]; try { localStorage.removeItem('engimedit:' + k); } catch {} },
};

/* ---------------------------------------------------------------------------
   IndexedDB: progetti, file video (Blob), dati derivati (miniature, forma d'onda)
--------------------------------------------------------------------------- */
const DB = {
  _p: null,
  open() {
    if (this._p) return this._p;
    this._p = new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) return reject(new Error('no-idb'));
      const req = indexedDB.open('engimedit', 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('projects')) db.createObjectStore('projects', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('media')) db.createObjectStore('media', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('derived')) db.createObjectStore('derived', { keyPath: 'id' });
      };
      req.onsuccess = () => {
        const db = req.result;
        db.onversionchange = () => db.close();
        resolve(db);
      };
      req.onerror = () => reject(req.error || new Error('idb-open'));
      req.onblocked = () => reject(new Error('idb-blocked'));
    });
    this._p.catch(() => { this._p = null; });
    return this._p;
  },
  async _tx(store, mode, fn) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      let result;
      const tx = db.transaction(store, mode);
      const st = tx.objectStore(store);
      const r = fn(st);
      if (r && 'onsuccess' in r) r.onsuccess = () => { result = r.result; };
      tx.oncomplete = () => resolve(result);
      tx.onerror = () => reject(tx.error || new Error('idb-tx'));
      tx.onabort = () => reject(tx.error || new Error('idb-abort'));
    });
  },
  get(store, key) { return this._tx(store, 'readonly', (s) => s.get(key)); },
  put(store, val) { return this._tx(store, 'readwrite', (s) => s.put(val)); },
  del(store, key) { return this._tx(store, 'readwrite', (s) => s.delete(key)); },
  all(store) { return this._tx(store, 'readonly', (s) => s.getAll()); },
  keys(store) { return this._tx(store, 'readonly', (s) => s.getAllKeys()); },
  clear(store) { return this._tx(store, 'readwrite', (s) => s.clear()); },
};

/* ---------------------------------------------------------------------------
   Piattaforma: capability del visualizzatore claude.ai (db, user, downloads).
   Ogni capability può mancare: l'app funziona sempre in modalità ospite.
--------------------------------------------------------------------------- */
const Platform = {
  async use(name) {
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return null;
      return await window.claude.use(name);
    } catch { return null; }
  },
};

/** Salva un file sul computer: capability "downloads" se presente, altrimenti link classico. */
async function saveFile(filename, blob) {
  const dl = await Platform.use('downloads');
  if (dl) {
    try { await dl.save({ filename, data: blob }); return 'saved'; }
    catch (e) {
      const code = e && e.code;
      if (code === 'declined') return 'declined';
      if (code === 'rate_limited') throw Object.assign(new Error('rate'), { code });
      if (code === 'too_large') throw Object.assign(new Error('too_large'), { code });
      if (!['unavailable', 'not_granted', 'capability_disabled', 'capability_removed'].includes(code)) throw e;
    }
  }
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: filename, style: { display: 'none' } });
  // con una finestra modale aperta il resto della pagina è inerte: il link va dentro la finestra
  (document.querySelector('dialog[open]') || document.body).appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  return 'saved';
}

/** Diagnostica degli errori: raccolta locale, mai inviata altrove. */
const ErrLog = {
  items: [],
  add(where, err) {
    const msg = (err && (err.message || err.name)) || String(err);
    this.items.push({ at: new Date().toISOString(), where, msg: String(msg).slice(0, 300) });
    if (this.items.length > 40) this.items.shift();
    console.warn('[EngimEdit]', where, err);
  },
};
window.addEventListener('error', (e) => ErrLog.add('window', e.error || e.message));
window.addEventListener('unhandledrejection', (e) => ErrLog.add('promise', e.reason));

/* ===== engine.js ===== */
/* =========================================================================
   engine.js — motore della timeline, indipendente dall'interfaccia.
   Tre tracce:
   • V1 "sequenza con ripple automatico": le clip sono sempre una dopo
     l'altra, senza buchi. Le posizioni si ricavano dall'ordine.
   • V2 (sovrapposizione: immagini, titoli, livelli di regolazione) e
     A1 (audio): posizionamento libero, ogni clip ha il proprio `start`
     e le clip della stessa traccia non si sovrappongono.
   Tutte le funzioni sono pure: non modificano mai gli array ricevuti.
   ========================================================================= */
const Engine = (() => {
  const SCHEMA = 2;
  const MIN_CLIP = 0.1;           // durata minima di una clip (secondi)
  const FREE_MAX = 3600;          // durata massima di immagini, titoli e livelli (secondi)
  const FORMATS = {
    '16:9': { w: 16, h: 9 },
    '9:16': { w: 9, h: 16 },
    '1:1': { w: 1, h: 1 },
    '4:5': { w: 4, h: 5 },
  };
  const SPEEDS = [0.25, 0.5, 1, 1.5, 2, 4];
  const LABELS = ['red', 'amber', 'green', 'violet', 'lilac', 'grey'];
  const BLANKING = { none: 0, '1.33': 4 / 3, '1.85': 1.85, '2.39': 2.39 };
  const EQ_PRESETS = ['neutral', 'voice', 'music', 'lowcut'];
  const BLENDS = ['normal', 'screen', 'multiply', 'overlay'];
  const rr = (x) => Math.round(x * 1e4) / 1e4;
  const clampN = (v, a, b, d) => (typeof v === 'number' && isFinite(v) ? Math.min(b, Math.max(a, v)) : d);

  /* ---------------- Valori predefiniti delle proprietà di una clip ---------- */
  const DEF = {
    tf: { zx: 1, zy: 1, link: true, x: 0, y: 0, rot: 0, flipH: false, flipV: false },
    crop: { l: 0, r: 0, t: 0, b: 0 },
    dz: { mode: 'off', amt: 0.2 },
    comp: { opacity: 1, blend: 'normal' },
    color: { lift: 0, gamma: 0, gain: 0, contrast: 0, sat: 0, temp: 0 },
    fx: { blur: 0, grain: 0, vignette: 0 },
    audio: { fadeIn: 0, fadeOut: 0, eq: 'neutral' },
    text: { content: 'Titolo', size: 0.09, color: '#ffffff', bg: false, bold: true, align: 'center' },
  };
  const GROUPS = Object.keys(DEF);
  /** Proprietà di gruppo con i valori predefiniti (le clip salvate possono non averle). */
  function g(c, k) { return c && c[k] ? { ...DEF[k], ...c[k] } : { ...DEF[k] }; }
  function isNeutral(c, k) { const v = g(c, k); return Object.keys(DEF[k]).every((x) => v[x] === DEF[k][x]); }
  function colorOn(c) { return !isNeutral(c, 'color'); }
  function fxOn(c) { return !isNeutral(c, 'fx'); }

  /** Tipo di clip: media (video o immagine da file), text, adjust. */
  function kindOf(c) { return c.kind || 'media'; }

  /** Durata in timeline di una clip (tiene conto della velocità). */
  function dur(c) { return rr((c.out - c.in) / (c.speed || 1)); }

  /** Posizioni calcolate di V1: [{clip, start, end}] */
  function layout(clips) {
    let t = 0;
    return clips.map((clip) => { const start = t; t = rr(t + dur(clip)); return { clip, start, end: t }; });
  }
  function total(clips) { let t = 0; for (const c of clips) t = rr(t + dur(c)); return t; }
  function startOf(clips, id) { let t = 0; for (const c of clips) { if (c.id === id) return t; t = rr(t + dur(c)); } return -1; }

  /** Trova la clip al tempo t. Oltre la fine restituisce l'ultima clip (fine inclusa). */
  function locate(clips, t) {
    if (!clips.length) return null;
    let s = 0;
    for (let i = 0; i < clips.length; i++) {
      const d = dur(clips[i]);
      const e = rr(s + d);
      if (t < e - 1e-6) return { index: i, clip: clips[i], start: s, end: e, local: Math.max(0, rr(t - s)) };
      s = e;
    }
    const i = clips.length - 1;
    const c = clips[i];
    return { index: i, clip: c, start: rr(s - dur(c)), end: s, local: dur(c), atEnd: true };
  }

  /** Tempo nella sorgente corrispondente al tempo t della timeline. */
  function sourceTime(clip, local) { return rr(clip.in + local * (clip.speed || 1)); }

  /** Divide la clip sotto il tempo t. Restituisce {clips, leftId, rightId} oppure {error}. */
  function split(clips, t, newId) {
    const loc = locate(clips, t);
    if (!loc || loc.atEnd) return { error: 'no-clip' };
    const c = loc.clip;
    const d = dur(c);
    if (loc.local < MIN_CLIP || d - loc.local < MIN_CLIP) return { error: 'edge' };
    const cut = sourceTime(c, loc.local);
    const left = { ...c, out: cut };
    const right = { ...c, id: newId, in: cut };
    const next = clips.slice();
    next.splice(loc.index, 1, left, right);
    return { clips: next, leftId: c.id, rightId: newId };
  }

  /** Limiti validi per il taglio di un lato. assetDur = durata del file sorgente. */
  function trimLimits(clip, side, assetDur) {
    const sp = clip.speed || 1;
    if (side === 'in') return { min: 0, max: rr(clip.out - MIN_CLIP * sp) };
    return { min: rr(clip.in + MIN_CLIP * sp), max: rr(assetDur) };
  }
  /** Imposta il punto d'ingresso (side='in') o d'uscita (side='out') entro i limiti. */
  function trim(clips, id, side, value, assetDur) {
    const i = clips.findIndex((c) => c.id === id);
    if (i < 0) return null;
    const c = clips[i];
    const lim = trimLimits(c, side, assetDur);
    const v = rr(Math.min(lim.max, Math.max(lim.min, value)));
    if ((side === 'in' && v === c.in) || (side === 'out' && v === c.out)) return null;
    const next = clips.slice();
    next[i] = side === 'in' ? { ...c, in: v } : { ...c, out: v };
    return next;
  }

  function remove(clips, ids) {
    const set = ids instanceof Set ? ids : new Set(ids);
    const next = clips.filter((c) => !set.has(c.id));
    return next.length === clips.length ? null : next;
  }

  /** Duplica le clip indicate subito dopo ciascun originale. */
  function duplicate(clips, ids, makeId) {
    const set = ids instanceof Set ? ids : new Set(ids);
    const next = []; const newIds = [];
    for (const c of clips) {
      next.push(c);
      if (set.has(c.id)) { const id = makeId(); newIds.push(id); next.push({ ...c, id }); }
    }
    return newIds.length ? { clips: next, newIds } : null;
  }

  /**
   * Sposta il blocco delle clip selezionate (nell'ordine attuale) nello spazio
   * di inserimento `gap` (0..n, riferito all'array originale).
   */
  function move(clips, ids, gap) {
    const set = ids instanceof Set ? ids : new Set(ids);
    const moving = []; const rest = [];
    let before = 0;
    clips.forEach((c, i) => {
      if (set.has(c.id)) { moving.push(c); if (i < gap) before++; }
      else rest.push(c);
    });
    if (!moving.length) return null;
    const at = Math.max(0, Math.min(rest.length, gap - before));
    const next = rest.slice(0, at).concat(moving, rest.slice(at));
    for (let i = 0; i < next.length; i++) if (next[i] !== clips[i]) return next;
    return null; // ordine invariato
  }

  function insert(clips, newClips, gap) {
    const at = Math.max(0, Math.min(clips.length, gap));
    return clips.slice(0, at).concat(newClips, clips.slice(at));
  }

  /**
   * Modifica le clip indicate. I campi-gruppo (tf, crop, color...) passati come
   * oggetto vengono UNITI ai valori esistenti: patch(c, ids, {tf: {rot: 90}}).
   */
  function patch(clips, ids, fields) {
    const set = ids instanceof Set ? ids : new Set(ids);
    let changed = false;
    const next = clips.map((c) => {
      if (!set.has(c.id)) return c;
      const n = { ...c };
      let ch = false;
      for (const k of Object.keys(fields)) {
        const v = fields[k];
        if (GROUPS.includes(k) && v && typeof v === 'object') {
          const cur = g(c, k);
          const merged = { ...cur, ...v };
          if (Object.keys(merged).some((x) => merged[x] !== cur[x])) { n[k] = merged; ch = true; }
        } else if (c[k] !== v) { n[k] = v; ch = true; }
      }
      if (!ch) return c;
      changed = true;
      return n;
    });
    return changed ? next : null;
  }

  /** Nuova clip da un file della libreria. `opts.fit` = regola di ridimensionamento predefinita. */
  function clipFromAsset(asset, id, opts = {}) {
    const d = asset.kind === 'image' ? (opts.imageDur || 5) : asset.duration;
    const c = { id, assetId: asset.id, in: 0, out: rr(d), volume: 1, muted: false, speed: 1, fit: opts.fit === 'fill' ? 'fill' : 'fit', ox: 0, oy: 0 };
    if (opts.start !== undefined) c.start = rr(Math.max(0, opts.start));
    return c;
  }
  /** Titolo o livello di regolazione (traccia V2). */
  function clipSynthetic(kind, id, start, length, text) {
    const c = { id, kind, in: 0, out: rr(length), start: rr(Math.max(0, start)), speed: 1, fit: 'fit', ox: 0, oy: 0, volume: 1, muted: true };
    if (kind === 'text') c.text = { ...DEF.text, content: text || DEF.text.content };
    return c;
  }

  /** Aggancio magnetico: restituisce il bersaglio più vicino entro la soglia, altrimenti il valore. */
  function snap(value, targets, threshold) {
    let best = value; let bd = threshold;
    for (const tg of targets) { const d = Math.abs(tg - value); if (d <= bd) { bd = d; best = tg; } }
    return best;
  }

  /** Spazio d'inserimento (0..n) più vicino al tempo t. */
  function gapAt(clips, t) {
    const L = layout(clips);
    for (let i = 0; i < L.length; i++) { const mid = (L[i].start + L[i].end) / 2; if (t < mid) return i; }
    return L.length;
  }

  /* ---------------- Tracce libere (V2, A1) ---------------- */
  function endOf(c) { return rr((c.start || 0) + dur(c)); }
  function freeSorted(clips) { return clips.slice().sort((a, b) => (a.start || 0) - (b.start || 0)); }
  function freeTotal(clips) { let m = 0; for (const c of clips) m = Math.max(m, endOf(c)); return rr(m); }
  /** Clip della traccia libera che copre il tempo t (se c'è). */
  function freeAt(clips, t) {
    for (const c of clips) { const s = c.start || 0; if (t >= s - 1e-6 && t < endOf(c) - 1e-6) return { clip: c, start: s, end: endOf(c), local: Math.max(0, rr(t - s)) }; }
    return null;
  }
  /**
   * Inizio valido più vicino a `want` per una clip lunga `d`, senza sovrapporsi
   * alle altre clip della traccia (escluse quelle in `skip`).
   */
  function fitFree(clips, skip, want, d) {
    const sk = skip instanceof Set ? skip : new Set(skip || []);
    const others = freeSorted(clips.filter((c) => !sk.has(c.id))).map((c) => [c.start || 0, endOf(c)]);
    const ok = (s) => s >= -1e-6 && others.every(([a, b]) => s + d <= a + 1e-6 || s >= b - 1e-6);
    want = Math.max(0, want);
    if (ok(want)) return rr(want);
    const cands = [0];
    for (const [a, b] of others) { cands.push(b, a - d); }
    let best = null; let bd = Infinity;
    for (const s of cands) if (ok(s) && Math.abs(s - want) < bd) { bd = Math.abs(s - want); best = s; }
    return rr(best === null ? (others.length ? others[others.length - 1][1] : 0) : best);
  }
  /** Inserisce una clip libera nel primo spazio valido vicino al suo `start`. */
  function insertFree(clips, clip) {
    const s = fitFree(clips, [], clip.start || 0, dur(clip));
    return freeSorted(clips.concat({ ...clip, start: s }));
  }
  /** Sposta le clip libere indicate di `delta` secondi (tutte insieme), se c'è spazio. */
  function moveFree(clips, ids, delta) {
    const set = ids instanceof Set ? ids : new Set(ids);
    const moving = clips.filter((c) => set.has(c.id));
    if (!moving.length || Math.abs(delta) < 1e-6) return null;
    const minStart = Math.min(...moving.map((c) => c.start || 0));
    if (minStart + delta < 0) delta = -minStart;
    const others = clips.filter((c) => !set.has(c.id));
    for (const m of moving) {
      const s = (m.start || 0) + delta; const e = s + dur(m);
      if (others.some((o) => s < endOf(o) - 1e-6 && e > (o.start || 0) + 1e-6)) return null;
    }
    if (Math.abs(delta) < 1e-6) return null;
    return freeSorted(clips.map((c) => (set.has(c.id) ? { ...c, start: rr((c.start || 0) + delta) } : c)));
  }
  /** Imposta l'inizio di una clip libera (si ferma prima di sovrapporsi). */
  function placeFree(clips, id, start) {
    const c = clips.find((x) => x.id === id);
    if (!c) return null;
    const s = fitFree(clips, [id], start, dur(c));
    if (Math.abs(s - (c.start || 0)) < 1e-6) return null;
    return freeSorted(clips.map((x) => (x.id === id ? { ...x, start: s } : x)));

      const tm = setTimeout(() => done(reject, new MediaError2('timeout')), 20000);
      a.onloadedmetadata = () => {
        if (!isFinite(a.duration)) { a.currentTime = 1e9; a.ontimeupdate = () => { a.ontimeupdate = null; done(resolve, { duration: a.duration }); }; return; }
        done(resolve, { duration: a.duration });
      };
      a.onerror = () => done(reject, new MediaError2(a.error && a.error.code === 3 ? 'corrupt' : 'unsupported'));
      a.src = url;
    });
  },
  /** Decodifica un'immagine (ridotta se enorme) e ne restituisce bitmap e dimensioni originali. */
  async decodeImage(blob) {
    let bmp;
    try { bmp = await createImageBitmap(blob); } catch { throw new MediaError2('corrupt'); }
    const W = bmp.width; const H = bmp.height;
    if (!W || !H) throw new MediaError2('corrupt');
    const big = Math.max(W, H);
    if (big > MAX_IMAGE_SIDE) {
      const k = MAX_IMAGE_SIDE / big;
      try { const small = await createImageBitmap(bmp, { resizeWidth: Math.round(W * k), resizeHeight: Math.round(H * k), resizeQuality: 'high' }); bmp.close(); bmp = small; } catch { /* resta a piena risoluzione */ }
    }
    return { bmp, W, H };
  },
  /** Miniatura di un'immagine (stesso formato delle miniature video). */
  imageThumb(bmp) {
    const th = 90; const tw = Math.round(Math.max(40, Math.min(200, (th * bmp.width) / bmp.height)));
    const c = document.createElement('canvas'); c.width = tw; c.height = th;
    c.getContext('2d').drawImage(bmp, 0, 0, tw, th);
    return c;
  },

  /** Attende la fine di un seek. Si chiude anche se la sorgente cambia o va in errore. */
  seek(v, time) {
    return new Promise((resolve) => {
      let done = false;
      const fin = () => {
        if (done) return; done = true;
        clearTimeout(tm);
        v.removeEventListener('seeked', fin); v.removeEventListener('emptied', fin); v.removeEventListener('error', fin); v.removeEventListener('loadedmetadata', go);
        resolve();
      };
      const go = () => {
        if (done) return;
        // +0,4 ms: evita di cadere sul fotogramma precedente per arrotondamenti dei decimali
        const target = Math.max(0, Math.min(time + 0.0004, (v.duration || time) - 0.001));
        if (Math.abs(v.currentTime - target) < 1e-4 && v.readyState >= 2 && !v.seeking) return fin();
        v.addEventListener('seeked', fin);
        v.currentTime = target;
      };
      v.addEventListener('emptied', fin); v.addEventListener('error', fin);
      const tm = setTimeout(fin, 4000);
      if (v.readyState >= 1) go(); else v.addEventListener('loadedmetadata', go);
    });
  },

  /* ---------------- Importazione ---------------- */
  /**
   * Importa un file nella libreria del progetto. Restituisce i metadati dell'asset.
   * Le fasi lente (miniature complete, audio) proseguono in background.
   */
  async importFile(file, { onMeta, imageDur = 5 } = {}) {
    const kind = this.classify(file);
    if (!kind) throw new MediaError2('not-video', { name: file.name });
    if (file.size > MAX_FILE) throw new MediaError2('too-big', { name: file.name });
    if (file.size === 0) throw new MediaError2('corrupt', { name: file.name });
    if (kind === 'image') return this.importImage(file, { onMeta, imageDur });
    if (kind === 'audio') return this.importAudio(file, { onMeta });
    const container = await this.sniff(file);
    let parsed = null;
    if (container === 'mp4') { try { parsed = await this.parseMp4(file); } catch (e) { parsed = null; } }
    const id = uid('a');
    const e = this.entry(id);
    e.blob = file; e.url = URL.createObjectURL(file);
    let info;
    try { info = await this.probe(e.url); }
    catch (err) {
      URL.revokeObjectURL(e.url); this.rt.delete(id);
      err.name2 = file.name; err.codec = parsed && parsed.video ? this.codecName(parsed.video.codec) : null; err.container = container;
      throw err;
    }
    if (!info.width || !info.height) { URL.revokeObjectURL(e.url); this.rt.delete(id); return this.importAudio(file, { onMeta, parsed }); } // solo audio
    if (!isFinite(info.duration) || info.duration < 0.1) { URL.revokeObjectURL(e.url); this.rt.delete(id); throw new MediaError2('corrupt', { name: file.name }); }
    const asset = {
      id, kind: 'video', name: file.name.slice(0, 160), size: file.size, type: file.type || '', container,
      duration: r4(info.duration), width: info.width, height: info.height,
      fps: parsed && parsed.video ? parsed.video.fps : null,
      codec: parsed && parsed.video ? this.codecName(parsed.video.codec) : (container === 'mkv' ? 'WebM / Matroska' : null),
      audioCodec: parsed && parsed.audio ? this.codecName(parsed.audio.codec) : null,
      hasAudio: parsed ? !!parsed.audio : null,
      addedAt: Date.now(),
    };
    if (onMeta) onMeta(asset);
    await this.store(id, file, asset);
    // Prima miniatura subito, il resto in background
    await this.makeThumbs(asset, 1);
    e.status = 'ready';
    this.emit(id);
    this.processInBackground(asset);
    return asset;
  },

  /** Archivia il file sul dispositivo. */
  async store(id, file, asset) {
    try { await DB.put('media', { id, blob: file, name: asset.name, size: file.size, addedAt: asset.addedAt }); }
    catch (err) {
      const e = this.rt.get(id); if (e && e.url) URL.revokeObjectURL(e.url); this.rt.delete(id);
      const q = err && (err.name === 'QuotaExceededError' || /quota/i.test(err.message || ''));
      throw new MediaError2(q ? 'quota' : 'store', { name: file.name });
    }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  },
  /** Immagine fissa (PNG, JPG, WebP): durata predefinita modificabile, nessun audio. */
  async importImage(file, { onMeta, imageDur = 5 } = {}) {
    const { bmp, W, H } = await this.decodeImage(file).catch((err) => { throw Object.assign(err, { name2: file.name }); });
    const id = uid('a');
    const e = this.entry(id);
    e.blob = file; e.url = URL.createObjectURL(file); e.image = bmp; e.audioState = 'none';
    const x = this.ext(file.name);
    const asset = { id, kind: 'image', name: file.name.slice(0, 160), size: file.size, type: file.type || '', container: x, duration: imageDur, width: W, height: H, fps: null, codec: (x === 'jpg' ? 'jpeg' : x).toUpperCase(), audioCodec: null, hasAudio: false, addedAt: Date.now() };
    if (onMeta) onMeta(asset);
    await this.store(id, file, asset);
    e.thumbs = [this.imageThumb(bmp)]; e.thumbTimes = [0];
    e.status = 'ready';
    this.emit(id);
    this.saveDerived(id);
    return asset;
  },
  /** File solo audio (MP3, WAV, M4A, OGG, AAC): musica e voce per la traccia A1. */
  async importAudio(file, { onMeta, parsed } = {}) {
    const id = uid('a');
    const e = this.entry(id);
    e.blob = file; e.url = URL.createObjectURL(file);
    let info;
    try { info = await this.probeAudio(e.url); }
    catch (err) { URL.revokeObjectURL(e.url); this.rt.delete(id); err.name2 = file.name; err.container = this.ext(file.name) || 'unknown'; throw err; }
    if (!isFinite(info.duration) || info.duration < 0.1) { URL.revokeObjectURL(e.url); this.rt.delete(id); throw new MediaError2('corrupt', { name: file.name }); }
    const x = this.ext(file.name);
    const asset = { id, kind: 'audio', name: file.name.slice(0, 160), size: file.size, type: file.type || '', container: x, duration: r4(info.duration), width: 0, height: 0, fps: null, codec: null, audioCodec: parsed && parsed.audio ? this.codecName(parsed.audio.codec) : (x ? x.toUpperCase() : null), hasAudio: true, addedAt: Date.now() };
    if (onMeta) onMeta(asset);
    await this.store(id, file, asset);
    e.status = 'ready';
    this.emit(id);
    this.processInBackground(asset);
    return asset;
  },

  /** Genera miniature, forma d'onda e audio decodificato; salva i dati derivati. */
  processInBackground(asset) {
    const e = this.entry(asset.id);
    // prima l'audio (serve per riprodurre ed esportare), poi le miniature complete
    e.audioP = this.decodeAudio(asset);
    e.bg = (async () => {
      await e.audioP;
      if (asset.kind !== 'audio') { try { await this.makeThumbs(asset, Math.max(1, Math.min(60, Math.ceil(asset.duration)))); } catch (err) { ErrLog.add('thumbs', err); } }
      await this.saveDerived(asset.id);
    })();
    return e.bg;
  },

  async makeThumbs(asset, count) {
    const e = this.entry(asset.id);
    if (e.thumbs.length >= count) return;
    const v = document.createElement('video');
    v.muted = true; v.preload = 'auto'; v.playsInline = true; v.src = e.url;
    await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = () => rej(new Error('thumb-load')); setTimeout(res, 8000); });
    const ar = asset.width / asset.height;
    const th = 90; const tw = Math.round(Math.max(40, Math.min(200, th * ar)));
    const D = asset.duration;
    const times = count === 1 ? [Math.min(0.2, D / 2)] : Array.from({ length: count }, (_, i) => Math.min(D - 0.05, (i + 0.5) * D / count));
    const thumbs = []; const tt = [];
    for (const time of times) {
      await this.seek(v, time);
      const c = document.createElement('canvas'); c.width = tw; c.height = th;
      const g = c.getContext('2d');
      try { g.drawImage(v, 0, 0, tw, th); } catch { g.fillStyle = '#222'; g.fillRect(0, 0, tw, th); }
      thumbs.push(c); tt.push(time);
      if (count > 1 && thumbs.length % 8 === 0) { e.thumbs = thumbs.slice(); e.thumbTimes = tt.slice(); this.emit(asset.id); await sleep(0); }
    }
    v.removeAttribute('src'); try { v.load(); } catch {}
    e.thumbs = thumbs; e.thumbTimes = tt;
    this.emit(asset.id);
  },

  /** Decodifica l'audio in sequenza (una alla volta per contenere la memoria). */
  decodeAudio(asset) {
    const e = this.entry(asset.id);
    const job = async () => {
      if (e.audioState === 'ready' || e.audioState === 'none') return;
      if (asset.hasAudio === false) { e.audioState = 'none'; this.emit(asset.id); return; }
      if (!e.blob) return;
      if (asset.size > MAX_AUDIO_DECODE) { e.audioState = 'toolarge'; this.emit(asset.id); return; }
      try {
        const buf = await e.blob.arrayBuffer();
        const audio = await this.audioCtx().decodeAudioData(buf);
        e.audio = audio; e.audioState = 'ready';
        if (!e.peaks) e.peaks = this.computePeaks(audio, asset.duration);
      } catch (err) {
        // Nessuna traccia audio oppure codec audio non decodificabile
        e.audioState = asset.hasAudio ? 'error' : 'none';
        if (err instanceof RangeError) e.audioState = 'toolarge';
      }
      this.emit(asset.id);
    };
    this._audioQueue = this._audioQueue.then(job, job);
    return this._audioQueue;
  },
  /** Attende che l'audio delle clip sia pronto (per riprodurre ed esportare in modo fedele). */
  async waitAudio(ids) {
    const pend = [];
    for (const id of ids) {
      const e = this.rt.get(id);
      if (e && e.status === 'ready' && e.audioState === 'pending' && e.audioP) pend.push(e.audioP);
    }
    if (pend.length) await Promise.all(pend.map((p) => Promise.resolve(p).catch(() => {})));
  },
  computePeaks(audio, duration) {
    const n = Math.max(1, Math.ceil(duration * PEAKS_PER_SEC));
    const out = new Float32Array(n);
    const chs = Array.from({ length: audio.numberOfChannels }, (_, i) => audio.getChannelData(i));
    const sr = audio.sampleRate; const per = sr / PEAKS_PER_SEC;
    for (let i = 0; i < n; i++) {
      const a = Math.floor(i * per); const b = Math.min(chs[0].length, Math.floor((i + 1) * per));
      let m = 0;
      for (const ch of chs) for (let j = a; j < b; j += 4) { const v = Math.abs(ch[j]); if (v > m) m = v; }
      out[i] = m;
    }
    return out;
  },
  async saveDerived(id) {
    const e = this.rt.get(id); if (!e) return;
    try {
      const blobs = await Promise.all(e.thumbs.map((c) => (c.toBlob ? new Promise((r) => c.toBlob(r, 'image/jpeg', 0.72)) : null)));
      await DB.put('derived', { id, thumbs: blobs.filter(Boolean), thumbTimes: e.thumbTimes, peaks: e.peaks, pps: e.pps, audioState: e.audioState === 'ready' ? 'ready' : e.audioState });
    } catch (err) { ErrLog.add('derived', err); }
  },

  /** Prepara gli asset di un progetto aperto: file dal dispositivo, miniature e forma d'onda in cache. */
  async loadProject(project) {
    const ids = Object.keys(project.assets);
    await Promise.all(ids.map(async (id) => {
      const asset = project.assets[id];
      const e = this.entry(id);
      if (e.status === 'ready' && e.url) return;
      let rec = null;
      try { rec = await DB.get('media', id); } catch (err) { ErrLog.add('load-media', err); }
      if (!rec || !rec.blob) { e.status = 'missing'; this.emit(id); return; }
      e.blob = rec.blob; e.url = URL.createObjectURL(rec.blob);
      if (asset.kind === 'image') {
        try { const { bmp } = await this.decodeImage(rec.blob); e.image = bmp; e.thumbs = [this.imageThumb(bmp)]; e.thumbTimes = [0]; e.status = 'ready'; }
        catch { e.status = 'missing'; }
        e.audioState = 'none';
        this.emit(id);
        return;
      }
      let der = null;
      try { der = await DB.get('derived', id); } catch {}
      if (der && der.thumbs && der.thumbs.length) {
        try {
          e.thumbs = await Promise.all(der.thumbs.map((b) => createImageBitmap(b)));
          e.thumbTimes = der.thumbTimes || [];
        } catch { e.thumbs = []; }
      }
      if (der && der.peaks) e.peaks = der.peaks;
      if (der && der.audioState === 'none') e.audioState = 'none';
      e.status = 'ready';
      this.emit(id);
      if (!e.thumbs.length && asset.kind !== 'audio') { try { await this.makeThumbs(asset, 1); } catch {} }
      // completa ciò che manca in background (prima l'audio)
      const needThumbs = asset.kind !== 'audio' && e.thumbs.length < Math.min(60, Math.ceil(asset.duration));
      e.audioP = this.decodeAudio(asset);
      e.bg = (async () => {
        await e.audioP;
        if (needThumbs) { try { await this.makeThumbs(asset, Math.max(1, Math.min(60, Math.ceil(asset.duration)))); } catch {} }
        if (needThumbs || !der || !der.peaks) await this.saveDerived(id);
      })();
    }));
  },

  /** Verifica che un file selezionato corrisponda a un asset mancante (nome, dimensione, durata). */
  async matchScore(asset, file) {
    let score = 0;
    if (file.size === asset.size) score += 2;
    if (file.name === asset.name) score += 1;
    if (score === 0) return 0;
    try {
      if (asset.kind === 'image') {
        const { bmp, W, H } = await this.decodeImage(file); bmp.close();
        if (W === asset.width && H === asset.height) score += 2; else return 0;
        return score;
      }
      const url = URL.createObjectURL(file);
      const info = await (asset.kind === 'audio' ? this.probeAudio(url) : this.probe(url)).finally(() => URL.revokeObjectURL(url));
      if (Math.abs(info.duration - asset.duration) < 0.2) score += 2; else return 0;
    } catch { return 0; }
    return score;
  },
  /** Ricollega un file a un asset esistente (stesso id, i tagli restano validi). */
  async relink(asset, file) {
    try { await DB.put('media', { id: asset.id, blob: file, name: file.name, size: file.size, addedAt: Date.now() }); }
    catch (err) {
      const q = err && (err.name === 'QuotaExceededError' || /quota/i.test(err.message || ''));
      throw new MediaError2(q ? 'quota' : 'store', { name: file.name });
    }
    const e = this.entry(asset.id);
    if (e.url) URL.revokeObjectURL(e.url);
    Demux.cache.delete(asset.id);
    e.blob = file; e.url = URL.createObjectURL(file); e.status = 'ready'; e.audioState = 'pending'; e.audio = null;
    if (asset.kind === 'image') {
      const { bmp } = await this.decodeImage(file); e.image = bmp; e.thumbs = [this.imageThumb(bmp)]; e.thumbTimes = [0]; e.audioState = 'none';
      this.emit(asset.id); this.saveDerived(asset.id); return;
    }
    if (asset.kind !== 'audio') { try { await this.makeThumbs(asset, 1); } catch {} }
    this.emit(asset.id);
    this.processInBackground(asset);
  },

  /** Rimuove i file non più usati da nessun progetto locale. */
  async collectGarbage() {
    try {
      const projects = await DB.all('projects');
      const used = new Set();
      for (const p of projects) for (const id of Object.keys(p.assets || {})) used.add(id);
      const keys = await DB.keys('media');
      let freed = 0;
      for (const k of keys) if (!used.has(k)) {
        const rec = await DB.get('media', k); freed += (rec && rec.size) || 0;
        await DB.del('media', k); await DB.del('derived', k).catch(() => {});
      }
      const dkeys = await DB.keys('derived');
      for (const k of dkeys) if (!used.has(k)) await DB.del('derived', k).catch(() => {});
      return freed;
    } catch (err) { ErrLog.add('gc', err); return 0; }
  },

  /** Messaggio chiaro per ogni errore d'importazione. */
  errorText(err, name) {
    const n = name || err.name2 || err.name || '';
    switch (err.code) {
      case 'not-video': return t('err.notMedia', { name: n });
      case 'too-big': return t('err.tooBig', { name: n, max: fmtBytes(MAX_FILE) });
      case 'unsupported':
        if (err.container === 'unknown') return t('err.corrupt', { name: n });
        if (err.codec && /HEVC/.test(err.codec)) return t('err.hevc', { name: n });
        if (err.container === 'avi' || err.container === 'mkv') return t('err.container', { name: n, fmt: err.container.toUpperCase() });
        return t('err.unsupported', { name: n });
      case 'corrupt': return t('err.corrupt', { name: n });
      case 'no-video': return t('err.noVideo', { name: n });
      case 'quota': return t('err.quota', { name: n });
      case 'read': return t('err.read', { name: n });
      case 'timeout': return t('err.timeout', { name: n });
      default: return t('err.generic', { name: n });
    }
  },
};

/* ===== render.js ===== */
/* =========================================================================
   render.js — composizione dei fotogrammi e catena audio, CONDIVISE da
   anteprima (Player) ed esportazione (Exporter): ciò che vedi e senti è
   esattamente ciò che esporti.
   • Livelli: V1 (sequenza principale) → V2 (immagini, titoli, livelli di
     regolazione) → bande nere di uscita (output blanking).
   • Trasformazioni, ritaglio e zoom dinamico con il contesto 2D.
   • Correzione colore ed effetti (sfocatura, grana, vignettatura) con un
     piccolo motore WebGL; se WebGL manca, stessa matematica sulla CPU.
   • Audio: dissolvenze e preset EQ/dinamica con Biquad e Compressor.
   ========================================================================= */

/* ---------------- Correzione colore ed effetti (WebGL) ---------------- */
const GL_VS = 'attribute vec2 p;varying vec2 uv;void main(){uv=p*0.5+0.5;gl_Position=vec4(p,0.0,1.0);}';
const GL_BLUR = `precision mediump float;varying vec2 uv;uniform sampler2D t;uniform vec2 dir;uniform float w[7];
void main(){vec4 c=texture2D(t,uv)*w[0];
for(int i=1;i<7;i++){float f=float(i);c+=(texture2D(t,uv+dir*f)+texture2D(t,uv-dir*f))*w[i];}
gl_FragColor=c;}`;
const GL_GRADE = `#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 uv;uniform sampler2D t;uniform float lift,gam,gain,con,sat,temp,vig,grain,seed,cell;uniform vec2 res;
float hash(vec2 p){vec3 q=fract(vec3(p.xyx)*0.1031+seed*0.0137);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
void main(){vec4 s=texture2D(t,uv);float a=s.a;if(a<=0.0){gl_FragColor=vec4(0.0);return;}
vec3 c=s.rgb/a;
c=c*gain+lift*(1.0-c);c=clamp(c,0.0,1.0);c=pow(c,vec3(gam));
c=(c-0.5)*con+0.5;float l=dot(c,vec3(0.2126,0.7152,0.0722));c=mix(vec3(l),c,sat);
c+=vec3(temp*0.08,temp*0.015,-temp*0.08);
vec2 asp=vec2(res.x/res.y,1.0);float r=length((uv-0.5)*asp)/length(asp*0.5);
c*=1.0-vig*smoothstep(0.35,1.05,r);
c+=(hash(floor(gl_FragCoord.xy/cell))-0.5)*grain*0.35;
c=clamp(c,0.0,1.0);gl_FragColor=vec4(c*a,a);}`;

/** Parametri numerici dello shader a partire da colore ed effetti della clip. */
function gradeParams(color, fx, bypassColor) {
  const c = bypassColor ? Engine.DEF.color : color;
  return {
    lift: c.lift * 0.25, gam: Math.pow(2, -c.gamma), gain: 1 + c.gain, con: 1 + c.contrast, sat: 1 + c.sat, temp: c.temp,
    vig: fx.vignette, grain: fx.grain, blur: fx.blur,
  };
}

class Grader {
  constructor() { this.cv = document.createElement('canvas'); this.gl = null; this.failed = false; }
  _init() {
    if (this.gl) return true;
    if (this.failed) return false;
    let gl = null;
    try { gl = this.cv.getContext('webgl', { premultipliedAlpha: true, preserveDrawingBuffer: true, antialias: false, alpha: true, depth: false, stencil: false }); } catch { gl = null; }
    if (!gl) { this.failed = true; return false; }
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) || 'shader'); return s; };
    const prog = (fs) => {
      const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, GL_VS)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
      gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link');
      const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
      for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name.replace(/\[0\]$/, ''); u[name] = gl.getUniformLocation(p, name); }
      return { p, u };
    };
    try {
      this.pBlur = prog(GL_BLUR); this.pGrade = prog(GL_GRADE);
      const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

const Render = {
  /** Contesto di rendering: tele temporanee e motore colore. Uno per Player e uno per esportazione. */
  context() {
    const mk = () => document.createElement('canvas');

  },
  _fit(cv, W, H) { if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; } const g = cv.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, W, H); return g; },

  /** Testo di un titolo come immagine, con dimensioni relative all'altezza del fotogramma. */
  textSource(rc, clip, W, H) {
    const tx = Engine.g(clip, 'text');

    const hit = rc.texts.get(clip.id);
    if (hit && hit.key === key) return hit;
    const px = Math.max(4, tx.size * H);
    const font = `${tx.bold ? 800 : 500} ${px.toFixed(1)}px "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif`;
    const lines = String(tx.content || ' ').split('\n').slice(0, 12);

  /**

/* ---------------- Audio: dissolvenze e preset EQ / dinamica ---------------- */
const AudioFX = {
  /** Catena di equalizzazione e dinamica del preset; restituisce il nodo d'ingresso. */
  chain(ac, preset, dest) {
    const bq = (type, f, gain, q) => { const n = ac.createBiquadFilter(); n.type = type; n.frequency.value = f; if (gain !== undefined) n.gain.value = gain; if (q !== undefined) n.Q.value = q; return n; };

    else if (preset === 'music') nodes = [bq('lowshelf', 150, 1.5), bq('peaking', 2500, -5, 0.8), comp(-26, 2, 10, 0.02, 0.3), gain(0.85)];
    else if (preset === 'lowcut') nodes = [bq('highpass', 140, undefined, 0.71), bq('lowshelf', 250, -4)];
    else return dest;
    for (let i = 0; i < nodes.length - 1; i++) nodes[i].connect(nodes[i + 1]);
    nodes[nodes.length - 1].connect(dest);
    return nodes[0];
  },
  /** Clip con audio, con il loro inizio in timeline: V1 (sequenza) + A1 (libera). */
  items(project) {
    const out = [];
    for (const { clip, start } of Engine.layout(Engine.track(project, 'v1').clips)) out.push({ clip, start });
    for (const clip of Engine.track(project, 'a1').clips) out.push({ clip, start: clip.start || 0 });
    return out.filter(({ clip }) => { const e = Media.get(clip.assetId); return e && e.audio && !clip.muted && !clip.disabled && clip.volume > 0; });
  },
  /**
   * Programma l'audio a partire dal tempo t0 della timeline; `base` è l'istante
   * del contesto audio che corrisponde a t0. Uguale in anteprima ed esportazione.
   */
  schedule(ac, dest, project, t0, base) {
    const sources = [];
    for (const { clip: c, start } of this.items(project)) {

      src.start(when, off, c.out - off);
      sources.push(src);
    }

  },

/* ===== player.js ===== */
/* =========================================================================
   player.js — anteprima della sequenza "come sarà esportata".
   • Orologio principale: AudioContext (l'audio viene dai buffer decodificati,
     lo stesso usato nell'esportazione, con le stesse dissolvenze ed EQ).
   • Video V1: due lettori nascosti (A/B). Mentre uno suona, l'altro prepara
     la clip video successiva già posizionata: il cambio clip è senza scatti.
   • Ogni fotogramma viene composto con Render.frame (V1 + V2 + colore +
     effetti + bande nere), la stessa funzione dell'esportazione.
   ========================================================================= */

/** Disegna un fotogramma sorgente nel formato di uscita (Adatta / Riempi + inquadratura). Usato per miniature. */
function drawFrame(ctx, W, H, src, sw, sh, clip) {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  if (!src || !sw || !sh) return;
  const fill = clip && clip.fit === 'fill';
  const s = fill ? Math.max(W / sw, H / sh) : Math.min(W / sw, H / sh);
  const dw = sw * s; const dh = sh * s;
  let dx = (W - dw) / 2; let dy = (H - dh) / 2;
  if (fill) {
    dx -= ((clip.ox || 0) * (dw - W)) / 2;
    dy -= ((clip.oy || 0) * (dh - H)) / 2;
  }
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  try { ctx.drawImage(src, dx, dy, dw, dh); } catch { /* fotogramma non ancora disponibile */ }
}
function drawMissing(ctx, W, H, text) {
  ctx.fillStyle = '#120d24'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(167,139,250,0.35)'; ctx.lineWidth = Math.max(2, W / 300);
  ctx.setLineDash([10, 8]); ctx.strokeRect(W * 0.08, H * 0.08, W * 0.84, H * 0.84); ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(244,242,255,0.8)';
  ctx.font = `600 ${Math.round(Math.min(W, H) / 18)}px ${getComputedStyle(document.body).fontFamily}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, W / 2, H / 2);
}

let VPOOL = null;

  if (!VPOOL) { VPOOL = h('div', { class: 'vpool', 'aria-hidden': 'true' }); document.body.appendChild(VPOOL); }
  return VPOOL;
}

  v.muted = true; v.playsInline = true; v.preload = 'auto'; v.disablePictureInPicture = true;
  v.setAttribute('muted', ''); v.setAttribute('playsinline', '');

/** La clip V1 mostra un'immagine fissa (nessun lettore video). */
function isImageClip(clip) { const e = Media.get(clip.assetId); return !!(e && e.image); }

class Player {

/* =========================================================================
   demux.js — lettura diretta dei campioni video da file MP4/MOV (H.264)
   e decodifica esatta con WebCodecs per l'esportazione.
   Ogni fotogramma esportato è quello giusto della sorgente, a qualunque
   velocità del computer; la composizione (V2, colore, effetti) avviene in
   Render.frame tramite la funzione `paint` ricevuta dall'esportazione. Per gli altri formati si usa la cattura in
   riproduzione (export.js → captureClip).

class BlobReader {
  constructor(blob) { this.blob = blob; this.ws = 0; this.buf = null; }
  async read(off, size) {
    if (!this.buf || off < this.ws || off + size > this.ws + this.buf.byteLength) {

      this.ws = off;
      if (this.buf.byteLength < size) throw new Error('short-read');
    }
    return this.buf.subarray(off - this.ws, off - this.ws + size);
  }
