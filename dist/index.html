    const sp = clip.speed || 1;
    const lastSrc = Math.max(clip.in, clip.out - 0.0005);
    const sAt = (k) => Math.min(lastSrc, Math.max(clip.in, clip.in + (k / fps - start) * sp));
    const S = idx.samples;
    const t0 = sAt(k0); const tEnd = sAt(k1 - 1);
    let first = 0;
    for (let i = 0; i < S.length; i++) if (S[i].key && S[i].pts <= t0 + 1e-6) first = i;
    // si decodifica fino al primo fotogramma chiave dopo la fine, più un margine per il riordino
    let last = S.length;
    for (let i = first + 1; i < S.length; i++) if (S[i].key && S[i].pts > tEnd + 1e-6) { last = Math.min(S.length, i + 16); break; }
    let k = k0; let cur = null; let err = null;
    const emit = () => { paint(k, cur, cur.displayWidth, cur.displayHeight); writer.addFrame(g.canvas); k++; if (k % 3 === 0) report(); };
    const dec = new VideoDecoder({
      output: (frame) => {
        try {
          if (k >= k1 || err) { frame.close(); return; }
          const p = frame.timestamp / 1e6;
          while (cur && k < k1 && sAt(k) + 1e-4 < p) emit();
          if (cur) cur.close();
          cur = frame;
        } catch (e) { err = e; frame.close(); }
      },
      error: (e) => { err = e; },
    });
    const reader = new BlobReader(idx.blob);
    try {
      dec.configure(idx.cfg);
      for (let i = first; i < last; i++) {
        if (signal.aborted) throw new ExportAbort();
        if (err) throw err;
        if (k >= k1) break;
        while (dec.decodeQueueSize > 6 || writer.queue > 12) { if (err) throw err; writer.check(); await sleep(2); }
        const s = S[i];
        const data = await reader.read(s.off, s.size);
        dec.decode(new EncodedVideoChunk({ type: s.key ? 'key' : 'delta', timestamp: Math.round(s.pts * 1e6), data }));
      }
      if (k < k1) await dec.flush();
      if (err) throw err;
      if (cur) while (k < k1) { emit(); if (writer.queue > 24) await writer.drain(8); }
      return k;
    } catch (e) {
      if (e && e.code === 'abort') throw e;
      ErrLog.add('decode', e);
      return k;   // l'esportazione prosegue da qui con la cattura in riproduzione
    } finally {
      if (cur) { try { cur.close(); } catch {} }
      try { dec.close(); } catch {}
    }
  },
};

/* ===== export.js ===== */
/* =========================================================================
   export.js — esportazione della sequenza.
   Percorso principale: WebCodecs (H.264 + AAC/Opus) + mp4-muxer → file MP4.
   I fotogrammi V1 arrivano dalla decodifica diretta (demux.js) o dalla
   cattura in riproduzione e vengono composti con Render.frame (V2, colore,
   effetti, bande nere), come nell'anteprima. L'audio (V1 + A1, dissolvenze,
   EQ) viene mixato con OfflineAudioContext tramite AudioFX.schedule, la
   stessa funzione dell'anteprima. Ripiego: MediaRecorder in tempo reale.
   ========================================================================= */
class ExportAbort extends Error { constructor() { super('abort'); this.code = 'abort'; } }

/** Scrittore MP4: encoder video/audio + muxer. Riutilizzato anche per le clip di esempio. */
class MP4Writer {
  constructor({ W, H, fps, vcodec, vbr, acodec }) {
    this.W = W; this.H = H; this.fps = fps; this.err = null;
    const vfamily = vcodec.startsWith('avc') ? 'avc' : vcodec.startsWith('vp09') ? 'vp9' : 'av1';
    this.muxer = new Mp4Muxer.Muxer({
      target: new Mp4Muxer.ArrayBufferTarget(),
      video: { codec: vfamily, width: W, height: H, frameRate: fps },
      audio: acodec ? { codec: acodec.name, numberOfChannels: 2, sampleRate: 48000 } : undefined,
      fastStart: 'in-memory',
      firstTimestampBehavior: 'offset',
    });
    this.ve = new VideoEncoder({
      output: (chunk, meta) => { try { this.muxer.addVideoChunk(chunk, meta); } catch (e) { this.err = e; } },
      error: (e) => { this.err = e; },
    });
    const cfg = { codec: vcodec, width: W, height: H, bitrate: vbr, framerate: fps, latencyMode: 'quality' };
    if (vfamily === 'avc') cfg.avc = { format: 'avc' };
    this.ve.configure(cfg);
    this.acodec = acodec;
    this.k = 0;
  }
  check() { if (this.err) throw this.err; }
  addFrame(source) {
    this.check();
    const ts = Math.round((this.k * 1e6) / this.fps);
    const frame = new VideoFrame(source, { timestamp: ts, duration: Math.round(1e6 / this.fps) });
    this.ve.encode(frame, { keyFrame: this.k % (this.fps * 2) === 0 });
    frame.close();
    this.k++;
  }
  get queue() { return this.ve.encodeQueueSize; }
  async drain(max = 8) { while (this.ve.encodeQueueSize > max) { this.check(); await sleep(3); } this.check(); }
  async addAudio(buf, signal) {
    if (!this.acodec || !buf) return;
    const ae = new AudioEncoder({
      output: (chunk, meta) => { try { this.muxer.addAudioChunk(chunk, meta); } catch (e) { this.err = e; } },
      error: (e) => { this.err = e; },
    });
    ae.configure({ codec: this.acodec.codec, sampleRate: 48000, numberOfChannels: 2, bitrate: this.acodec.br });
    const L = buf.getChannelData(0); const R = buf.numberOfChannels > 1 ? buf.getChannelData(1) : L;
    const step = 4800;
    for (let i = 0; i < buf.length; i += step) {
      if (signal && signal.aborted) { try { ae.close(); } catch {} throw new ExportAbort(); }
      const n = Math.min(step, buf.length - i);
      const data = new Float32Array(n * 2);
      data.set(L.subarray(i, i + n), 0); data.set(R.subarray(i, i + n), n);
      const ad = new AudioData({ format: 'f32-planar', sampleRate: 48000, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round((i * 1e6) / 48000), data });
      ae.encode(ad); ad.close();
      if (ae.encodeQueueSize > 40) await sleep(1);
      this.check();
    }
    await ae.flush(); ae.close();
    this.check();
  }
  async finish() {
    await this.ve.flush(); this.check();
    try { this.ve.close(); } catch {}
    this.muxer.finalize();
    return new Blob([this.muxer.target.buffer], { type: 'video/mp4' });
  }
  abort() { try { this.ve.close(); } catch {} }
}

const Exporter = {
  /* Preset per i social. format null = formato del progetto. res = lato corto. */
  PRESETS: [
    { id: 'youtube', icon: 'youtube', format: '16:9', res: 1080, fps: 30, quality: 'high' },
    { id: 'reels', icon: 'vertical', format: '9:16', res: 1080, fps: 30, quality: 'high' },
    { id: 'insta', icon: 'portrait', format: '4:5', res: 1080, fps: 30, quality: 'high' },
    { id: 'hq', icon: 'star', format: null, res: 'max', fps: 30, quality: 'max' },
    { id: 'light', icon: 'feather', format: null, res: 720, fps: 30, quality: 'low' },
  ],
  QUALITY_BPP: { low: 0.045, medium: 0.07, high: 0.1, max: 0.16 },

  dims(format, res) {
    const f = Engine.FORMATS[format] || Engine.FORMATS['16:9'];
    const even = (x) => Math.max(2, Math.round(x / 2) * 2);
    if (f.w >= f.h) return { w: even((res * f.w) / f.h), h: even(res) };
    return { w: even(res), h: even((res * f.h) / f.w) };
  },
  /** Risoluzione massima sensata: quella delle sorgenti usate, tra 1080 e 2160. */
  maxRes(project) {
    let m = 0;
    for (const c of project.tracks[0].clips) { const a = project.assets[c.assetId]; if (a) m = Math.max(m, Math.min(a.width, a.height)); }
    return Math.max(1080, Math.min(2160, m || 1080));
  },
  bitrate(w, h, fps, quality) { return Math.round(Math.max(1.2e6, Math.min(60e6, w * h * fps * (this.QUALITY_BPP[quality] || 0.1)))); },
  level(w, h, fps) {
    const mbs = Math.ceil(w / 16) * Math.ceil(h / 16); const mbps = mbs * fps;
    const L = [[0x1f, 108000, 3600], [0x28, 245760, 8192], [0x2a, 522240, 8704], [0x32, 589824, 22080], [0x33, 983040, 36864], [0x34, 2073600, 36864], [0x3c, 4177920, 139264]];
    for (const [lv, rate, size] of L) if (mbps <= rate && mbs <= size) return lv.toString(16).padStart(2, '0');
    return '3c';
  },
  async pickAudio() {
    if (!window.AudioEncoder || !window.AudioData) return null;
    for (const [codec, name, br] of [['mp4a.40.2', 'aac', 160000], ['opus', 'opus', 128000]]) {
      try { const s = await AudioEncoder.isConfigSupported({ codec, sampleRate: 48000, numberOfChannels: 2, bitrate: br }); if (s.supported) return { codec, name, br }; } catch {}
    }
    return null;
  },
  async pickVideo(w, h, fps, vbr, allowVp9) {
    if (!window.VideoEncoder || !window.VideoFrame) return null;
    const L = this.level(w, h, fps);
    const list = [`avc1.6400${L}`, `avc1.4d00${L}`, `avc1.42e0${L}`, `avc1.4200${L}`];
    if (allowVp9) list.push('vp09.00.40.08');
    for (const codec of list) {
      try {
        const cfg = { codec, width: w, height: h, bitrate: vbr, framerate: fps };
        if (codec.startsWith('avc')) cfg.avc = { format: 'avc' };
        const s = await VideoEncoder.isConfigSupported(cfg);
        if (s.supported) return codec;
      } catch {}
    }
    return null;
  },
  /** Decide come esportare con il browser attuale. */
  async plan(w, h, fps, vbr, needAudio) {
    const vcodec = await this.pickVideo(w, h, fps, vbr, false);
    const acodec = needAudio ? await this.pickAudio() : null;
    if (vcodec && (acodec || !needAudio) && window.Mp4Muxer) {
      const a = acodec ? (acodec.name === 'aac' ? ' + AAC' : ' + Opus') : '';
      return { mode: 'webcodecs', vcodec, acodec, ext: 'mp4', mime: 'video/mp4', label: `MP4 (H.264${a})`, opusWarn: !!(acodec && acodec.name === 'opus') };
    }
    if (window.MediaRecorder && HTMLCanvasElement.prototype.captureStream) {
      const opts = [['video/mp4;codecs=avc1,mp4a.40.2', 'mp4', 'MP4 (H.264 + AAC)'], ['video/mp4', 'mp4', 'MP4'], ['video/webm;codecs=vp9,opus', 'webm', 'WebM (VP9 + Opus)'], ['video/webm;codecs=vp8,opus', 'webm', 'WebM (VP8 + Opus)'], ['video/webm', 'webm', 'WebM']];
      for (const [mime, ext, label] of opts) if (MediaRecorder.isTypeSupported(mime)) return { mode: 'recorder', mime, ext, label, realtime: true };
    }
    return null;
  },
  /** Progetto normalizzato: accetta anche il vecchio formato {clips, assets}. */
  projectOf(job) {
    if (job.project) return job.project;
    return { tracks: [{ id: 'v1', kind: 'video', clips: job.clips || [] }], settings: {}, assets: job.assets || {} };
  },
  needsAudio(p) {
    const project = Array.isArray(p) ? { tracks: [{ id: 'v1', clips: p }] } : p;
    return AudioFX.items(project).length > 0;
  },
  estimateSize(seconds, vbr, hasAudio) { return Math.round(((vbr + (hasAudio ? 160000 : 0)) * seconds) / 8 * 1.03); },

  /** Mix audio dell'intero progetto (stessa programmazione dell'anteprima). */
  async renderMix(project) {
    if (Array.isArray(project)) project = { tracks: [{ id: 'v1', clips: project }] };
    const total = Engine.projectTotal(project);
    const len = Math.max(1, Math.ceil(total * 48000));
    const oc = new OfflineAudioContext(2, len, 48000);
    AudioFX.schedule(oc, oc.destination, project, 0, 0);
    return oc.startRendering();
  },
  assetIds(project) { const s = new Set(); for (const tr of project.tracks) for (const c of tr.clips) if (c.assetId) s.add(c.assetId); return [...s]; },

  /**
   * Esegue l'esportazione.
   * job: { clips, W, H, fps, vbr, plan }
   * hooks: { stage(name), progress(frac, info), signal }
   */
  async run(job, hooks) {
    if (job.plan.mode === 'recorder') return this.runRecorder(job, hooks);
    return this.runWebCodecs(job, hooks);
  },

  async runWebCodecs(job, hooks) {
    const { W, H, fps, vbr, plan } = job;
    const project = this.projectOf(job);
    const clips = Engine.track(project, 'v1').clips;
    const signal = hooks.signal;
    const total = Engine.projectTotal(project);
    const N = Math.max(1, Math.ceil(total * fps - 1e-6));
    hooks.stage('prepare');
    await Media.waitAudio(this.assetIds(project));
    const mix = plan.acodec ? await this.renderMix(project) : null;
    if (signal.aborted) throw new ExportAbort();
    const writer = new MP4Writer({ W, H, fps, vcodec: plan.vcodec, vbr, acodec: plan.acodec });
    const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
    const g = canvas.getContext('2d', { alpha: false });
    const rc = Render.context();
    /** Compone il fotogramma k (stessa funzione dell'anteprima). */
    const painter = (clip, start) => (k, src, sw, sh) => Render.frame(g, W, H, { t: k / fps, project, v1: src ? { clip, local: Math.max(0, k / fps - start), src, sw, sh } : null, rc, bypass: false });
    /** Fotogrammi senza sorgente video (immagini, clip disattivate, oltre la fine di V1). */
    const still = async (k0, k1, paint, src, sw, sh) => {
      for (let k = k0; k < k1; k++) {
        if (signal.aborted) throw new ExportAbort();
        while (paused) await sleep(200);
        paint(k, src, sw, sh); writer.addFrame(canvas);
        if (k % 3 === 0) report();
        await writer.drain(6);
      }
    };
    const players = new Map();
    const t0 = performance.now();
    let paused = false;
    const onVis = () => { paused = document.hidden; hooks.paused && hooks.paused(paused); };
    document.addEventListener('visibilitychange', onVis);
    const report = () => {
      const frac = writer.k / N;
      const el = (performance.now() - t0) / 1000;
      hooks.progress(frac, { eta: frac > 0.02 ? el / frac - el : null });
    };
    try {
      hooks.stage('video');
      let kEnd = 0;
      for (const { clip, start, end } of Engine.layout(clips)) {
        // il fotogramma k appartiene alla clip che contiene l'istante k/fps (come nell'anteprima)
        const k0 = Math.ceil(start * fps - 1e-6); const k1 = Math.min(N, Math.ceil(end * fps - 1e-6));
        kEnd = Math.max(kEnd, k1);
        if (k1 <= k0) continue;
        const paint = painter(clip, start);
        const ent = Media.get(clip.assetId);
        if (clip.disabled || !ent) { await still(k0, k1, paint, null); continue; }
        if (ent.image) { await still(k0, k1, paint, ent.image, ent.image.width, ent.image.height); continue; }
        // 1) decodifica diretta e esatta (MP4/MOV H.264)
        let kk = k0;
        const idx = await Demux.prepare(clip.assetId);
        if (idx) kk = await Demux.decodeClip({ idx, clip, start, k0, k1, fps, writer, g, paint, signal, report });
        if (kk >= k1) continue;
        // 2) altri formati (o decodifica non riuscita): cattura durante la riproduzione
        let v = players.get(clip.assetId);
        if (!v) {
          v = makeVideoEl(); v.src = Media.get(clip.assetId).url;
          await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = () => rej(new Error('load')); setTimeout(res, 8000); });
          players.set(clip.assetId, v);
        }
        const assets = project.assets || job.assets || {};
        await this.captureClip({ v, clip, start, k0: kk, k1, fps, writer, g, paint, signal, report, isPaused: () => paused, srcFps: (assets[clip.assetId] && assets[clip.assetId].fps) || null });
      }
      // dopo la fine di V1 (titoli, immagini in V2 o musica in A1 più lunghi)
      if (kEnd < N) await still(kEnd, N, painter(null, 0), null);
      if (signal.aborted) throw new ExportAbort();
      hooks.stage('audio');
      if (mix) await writer.addAudio(mix, signal);
      hooks.stage('final');
      const blob = await writer.finish();
      return { blob, ext: 'mp4', mime: 'video/mp4', label: plan.label, duration: total, W, H };
    } catch (e) {
      writer.abort();
      throw e;
    } finally {
      document.removeEventListener('visibilitychange', onVis);
      for (const v of players.values()) { try { v.pause(); v.removeAttribute('src'); v.load(); } catch {} v.remove(); }
    }
  },

  /**
   * Cattura i fotogrammi [k0, k1) di una clip.
   * La sorgente viene riprodotta e ogni fotogramma presentato (requestVideoFrameCallback)
   * viene composto sul canvas. Se il browser salta dei fotogrammi (computer sotto sforzo),
   * quelli mancanti vengono recuperati con un seek esatto e la velocità viene ridotta.
   */
  async captureClip({ v, clip, start, k0, k1, fps, writer, g, paint, signal, report, isPaused, srcFps }) {
    const sp = clip.speed || 1;
    const lastSrc = Math.max(clip.in, clip.out - 0.0005);
    const sAt = (k) => Math.min(lastSrc, Math.max(clip.in, clip.in + (k / fps - start) * sp));
    // l'ultimo fotogramma sorgente viene tenuto da parte: ogni fotogramma d'uscita viene poi
    // composto al proprio istante (zoom dinamico, titoli e grana cambiano nel tempo)
    const hold = document.createElement('canvas');
    const draw = () => {
      if (!v.videoWidth) return;
      if (hold.width !== v.videoWidth || hold.height !== v.videoHeight) { hold.width = v.videoWidth; hold.height = v.videoHeight; }
      try { hold.getContext('2d').drawImage(v, 0, 0); } catch { /* fotogramma non disponibile */ }
    };
    const fd = 1 / (srcFps && srcFps > 1 ? srcFps : 30);   // durata di un fotogramma sorgente
    let k = k0;
    let drawnT = sAt(k0);                                    // tempo del fotogramma presente nel canvas
    const emit = () => { paint(k, hold.width ? hold : null, hold.width, hold.height); writer.addFrame(g.canvas); k++; if (k % 3 === 0) report(); };
    await Media.seek(v, sAt(k0));
    draw();
    /** Fotogrammi esatti tramite seek fino al tempo `until` (escluso). */
    const exactUntil = async (until) => {
      while (k < k1 && sAt(k) + 1e-3 < until) {
        if (signal.aborted) throw new ExportAbort();
        while (isPaused()) await sleep(200);
        const s = sAt(k);
        if (s >= drawnT + fd * 0.999) { await Media.seek(v, s); draw(); drawnT = s; }
        emit();
        await writer.drain(6);
      }
    };
    const canCapture = 'requestVideoFrameCallback' in HTMLVideoElement.prototype && k1 - k0 > 4;
    if (!canCapture) { await exactUntil(Infinity); report(); return; }
    let rate = 1;
    let fallback = false;
    let rewindK = -1; let skips = 0;
    await new Promise((resolve, reject) => {
      let done = false; let last = performance.now(); let wasPaused = false; let busy = false;
      const finish = (err) => {
        if (done) return; done = true;
        clearInterval(wd); v.onended = null; v.pause();
        if (err) reject(err); else resolve();
      };
      const resume = () => {
        if (done) return;
        v.playbackRate = rate * sp;
        v.requestVideoFrameCallback(onFrame);
        if (!isPaused()) v.play().catch(() => {});
        last = performance.now();
      };
      const onFrame = (now, meta) => {
        if (done || busy) return;
        try {
          if (signal.aborted) return finish(new ExportAbort());
          const m = meta.mediaTime;
          last = performance.now();
          const skipped = m - drawnT > fd * 1.5 && k < k1 && sAt(k) + 1e-3 < m;
          if (skipped) {
            // il browser ha saltato dei fotogrammi: si emettono quelli coperti dal fotogramma già
            // nel canvas; poi si torna al primo mancante e si riparte più lentamente. Se il salto si
            // ripete nello stesso punto, i fotogrammi mancanti si prendono uno per uno con seek esatti.
            v.pause(); busy = true; skips++;
            while (k < k1 && sAt(k) + 1e-3 < m && sAt(k) < drawnT + fd * 0.999) emit();
            if (k >= k1) return finish();
            rate = Math.max(0.35, rate * 0.75);
            if (k !== rewindK) {
              rewindK = k;
              const target = sAt(k);
              Media.seek(v, target).then(() => { draw(); drawnT = target; busy = false; resume(); }, finish);
            } else {
              exactUntil(m).then(async () => {
                await Media.seek(v, m); draw(); drawnT = m; busy = false;
                if (k >= k1 || m >= clip.out - 1e-3) { while (k < k1) emit(); return finish(); }
                resume();
              }).catch(finish);
            }
            return;
          }
          while (k < k1 && sAt(k) + 1e-3 < m) emit();
          draw(); drawnT = m;
          if (k >= k1 || m >= clip.out - 1e-3) { while (k < k1) emit(); return finish(); }
          if (writer.queue > 24) {
            v.pause(); busy = true;
            writer.drain(4).then(() => { busy = false; resume(); }, finish);
            return;
          }
          v.requestVideoFrameCallback(onFrame);
        } catch (e) { finish(e); }
      };
      v.onended = () => { if (busy) return; try { while (k < k1) emit(); finish(); } catch (e) { finish(e); } };
      const wd = setInterval(() => {
        if (done || busy) return;
        if (signal.aborted) return finish(new ExportAbort());
        if (isPaused()) { if (!v.paused) v.pause(); wasPaused = true; last = performance.now(); return; }
        if (wasPaused) { wasPaused = false; resume(); return; }
        if (performance.now() - last > 4000) { fallback = true; finish(); }
      }, 250);
      resume();
    });
    v.playbackRate = 1;
    if (fallback && k < k1) await exactUntil(Infinity);
    report();
  },

  /** Ripiego: registrazione in tempo reale con MediaRecorder. */
  async runRecorder(job, hooks) {
    const { W, H, fps, vbr, plan } = job;
    const project = this.projectOf(job);
    const total = Engine.projectTotal(project);
    hooks.stage('prepare');
    await Media.waitAudio(this.assetIds(project));
    const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H;
    const ac = Media.audioCtx();
    if (ac.state === 'suspended') await ac.resume().catch(() => {});
    const dest = ac.createMediaStreamDestination();
    let ended; const endP = new Promise((r) => { ended = r; });
    const player = new Player({ canvas, getProject: () => project, audioOut: dest, onTime: (t) => hooks.progress(t / total, { eta: total - t }), onEnd: () => ended() });
    const vs = canvas.captureStream(fps);
    const stream = new MediaStream([...vs.getVideoTracks(), ...dest.stream.getAudioTracks()]);
    const rec = new MediaRecorder(stream, { mimeType: plan.mime, videoBitsPerSecond: vbr, audioBitsPerSecond: 160000 });
    const chunks = [];
    rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    const stopP = new Promise((r) => { rec.onstop = r; });
    const onAbort = () => { player.pause(true); ended(); };
    hooks.signal.addEventListener('abort', onAbort);
    try {
      player.t = 0;
      await player.renderAt(0);
      hooks.stage('video');
      rec.start(500);
      await player.play();
      await endP;
      rec.stop();
      await stopP;
      if (hooks.signal.aborted) throw new ExportAbort();
      hooks.stage('final');
      const blob = new Blob(chunks, { type: plan.mime.split(';')[0] });
      return { blob, ext: plan.ext, mime: plan.mime, label: plan.label, duration: total, W, H };
    } finally {
      hooks.signal.removeEventListener('abort', onAbort);
      try { if (rec.state !== 'inactive') rec.stop(); } catch {}
      player.destroy();
      vs.getTracks().forEach((tr) => tr.stop());
    }
  },
};

/* ===== sample.js ===== */
/* =========================================================================
   sample.js — tre clip di esempio generate al momento nel browser:
   animazioni originali + accordi sintetizzati. Liberamente distribuibili.
   ========================================================================= */
const Samples = {
  W: 1280, H: 720, FPS: 30, DUR: 5,

  scenes() {
    return [
      { key: 'sample.n1', draw: (g, t) => this.dawn(g, t), chord: [261.63, 329.63, 392.0, 523.25] },
      { key: 'sample.n2', draw: (g, t) => this.city(g, t), chord: [220.0, 261.63, 329.63, 440.0] },
      { key: 'sample.n3', draw: (g, t) => this.waves(g, t), chord: [174.61, 220.0, 261.63, 349.23] },
    ];
  },

  /* ---------------- scene ---------------- */
  label(g, n, title, t) {
    const { W, H } = this;
    g.fillStyle = 'rgba(8,5,22,0.55)';
    this.round(g, 40, 40, 74, 74, 18); g.fill();
    g.fillStyle = '#fff'; g.font = '800 46px "Plus Jakarta Sans", system-ui, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(n), 77, 79);
    g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    g.font = '800 64px "Plus Jakarta Sans", system-ui, sans-serif';
    g.shadowColor = 'rgba(0,0,0,0.45)'; g.shadowBlur = 18;
    g.fillText(title, 44, H - 70); g.shadowBlur = 0;
    // barra del tempo della clip: aiuta a vedere tagli e divisioni
    const p = t / this.DUR;
    g.fillStyle = 'rgba(255,255,255,0.25)'; this.round(g, 44, H - 46, W - 88, 8, 4); g.fill();
    g.fillStyle = '#fff'; this.round(g, 44, H - 46, Math.max(8, (W - 88) * p), 8, 4); g.fill();
    g.font = '700 30px "Plus Jakarta Sans", system-ui, sans-serif'; g.textAlign = 'right';
    g.fillText(t.toFixed(1).replace('.', I18N.lang === 'it' ? ',' : '.') + ' s', W - 44, 92);
    g.textAlign = 'left';
  },
  round(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); },
  dawn(g, t) {
    const { W, H } = this; const p = t / this.DUR;
    const sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, `hsl(${262 - p * 30}, 60%, ${16 + p * 14}%)`);
    sky.addColorStop(0.6, `hsl(${300 - p * 40}, 70%, ${40 + p * 12}%)`);
    sky.addColorStop(1, `hsl(${22 + p * 8}, 90%, ${58 + p * 6}%)`);
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    const sy = H * 0.78 - p * H * 0.38;
    const glow = g.createRadialGradient(W * 0.62, sy, 10, W * 0.62, sy, 260);
    glow.addColorStop(0, 'rgba(255,220,150,0.9)'); glow.addColorStop(1, 'rgba(255,160,120,0)');
    g.fillStyle = glow; g.fillRect(0, 0, W, H);
    g.fillStyle = '#ffe2a8'; g.beginPath(); g.arc(W * 0.62, sy, 70, 0, Math.PI * 2); g.fill();
    const hills = [['#3b2370', 0.74, 60, 0.004], ['#26164d', 0.82, 45, 0.006], ['#150c2e', 0.9, 30, 0.009]];
    for (const [col, base, amp, f] of hills) {
      g.fillStyle = col; g.beginPath(); g.moveTo(0, H);
      for (let x = 0; x <= W; x += 16) g.lineTo(x, H * base - Math.sin(x * f + base * 9) * amp - Math.cos(x * f * 0.5) * amp * 0.5);
      g.lineTo(W, H); g.closePath(); g.fill();
    }
    this.label(g, 1, t_('sample.n1'), t);
  },
  city(g, t) {
    const { W, H } = this;
    const sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#07051a'); sky.addColorStop(1, '#3a1f7a');
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 70; i++) { const x = (i * 97.3) % W; const y = (i * 53.7) % (H * 0.5); g.fillStyle = `rgba(255,255,255,${0.3 + 0.5 * Math.abs(Math.sin(t * 2 + i))})`; g.fillRect(x, y, 2, 2); }
    let x = -20; let i = 0;
    while (x < W) {
      const bw = 70 + ((i * 37) % 80); const bh = 180 + ((i * 71) % 300);
      g.fillStyle = i % 2 ? '#1c1240' : '#24185a'; g.fillRect(x, H - bh, bw, bh);
      for (let wy = H - bh + 18; wy < H - 30; wy += 26) for (let wx = x + 10; wx < x + bw - 12; wx += 18) {
        const on = Math.sin(wx * 0.37 + wy * 0.11 + Math.floor(t * 2 + i) * 1.7) > 0.15;
        g.fillStyle = on ? 'rgba(255,214,140,0.9)' : 'rgba(120,100,200,0.25)'; g.fillRect(wx, wy, 8, 12);
      }
      x += bw + 6; i++;
    }
    g.fillStyle = '#0b0820'; g.fillRect(0, H - 34, W, 34);
    for (let c = 0; c < 4; c++) {
      const cx = ((t * 260 + c * 360) % (W + 200)) - 100;
      g.fillStyle = c % 2 ? '#ff5c8a' : '#8bd3ff';
      g.shadowColor = g.fillStyle; g.shadowBlur = 16; g.fillRect(cx, H - 24, 36, 8); g.shadowBlur = 0;
    }
    this.label(g, 2, t_('sample.n2'), t);
  },
  waves(g, t) {
    const { W, H } = this;
    const bg = g.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, '#0f3d5e'); bg.addColorStop(1, '#4b2fc2');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    const layers = [['rgba(139,108,255,0.55)', 0.45, 34, 0.010, 1.4], ['rgba(80,200,230,0.55)', 0.58, 28, 0.013, -1.9], ['rgba(167,139,250,0.7)', 0.7, 22, 0.017, 2.6], ['rgba(20,12,60,0.85)', 0.84, 16, 0.02, -3.1]];
    for (const [col, base, amp, f, sp] of layers) {
      g.fillStyle = col; g.beginPath(); g.moveTo(0, H);
      for (let x = 0; x <= W; x += 12) g.lineTo(x, H * base + Math.sin(x * f + t * sp) * amp + Math.sin(x * f * 2.3 - t * sp * 0.7) * amp * 0.4);
      g.lineTo(W, H); g.closePath(); g.fill();
    }
    g.strokeStyle = 'rgba(255,255,255,0.5)'; g.lineWidth = 3; g.beginPath();
    g.arc(W * 0.78, H * 0.26, 46 + Math.sin(t * 3) * 4, 0, Math.PI * 2); g.stroke();
    this.label(g, 3, t_('sample.n3'), t);
  },

  /** Accordo arpeggiato: impulsi regolari ben visibili nella forma d'onda. */
  async audio(chord) {
    const sr = 48000; const len = this.DUR * sr;
    const oc = new OfflineAudioContext(2, len, sr);
    const master = oc.createGain(); master.gain.value = 0.5; master.connect(oc.destination);
    const pad = oc.createGain(); pad.gain.value = 0.05; pad.connect(master);
    for (const f of chord.slice(0, 3)) { const o = oc.createOscillator(); o.type = 'sine'; o.frequency.value = f / 2; o.connect(pad); o.start(0); o.stop(this.DUR); }
    const step = 0.25;
    for (let i = 0; i * step < this.DUR - 0.05; i++) {
      const at = i * step; const f = chord[i % chord.length] * (i % 8 >= 4 ? 2 : 1);
      const o = oc.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
      const g = oc.createGain(); g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(i % 4 === 0 ? 0.55 : 0.3, at + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, at + step * 0.95);
      const pan = oc.createStereoPanner(); pan.pan.value = Math.sin(i) * 0.4;
      o.connect(g); g.connect(pan); pan.connect(master); o.start(at); o.stop(at + step);
    }
    return oc.startRendering();
  },

  /** Genera i file. onProgress(0..1). Restituisce un array di File. */
  async generate(onProgress) {
    const scenes = this.scenes();
    const v = document.createElement('video');
    const playsAvc = v.canPlayType('video/mp4; codecs="avc1.42E01F"') !== '';
    const playsVp9 = v.canPlayType('video/mp4; codecs="vp09.00.10.08"') !== '';
    let vcodec = null;
    if (window.Mp4Muxer && window.VideoEncoder) {
      const vbr = 2500000;
      if (playsAvc) vcodec = await Exporter.pickVideo(this.W, this.H, this.FPS, vbr, false);
      if (!vcodec && playsVp9) {
        try { const s = await VideoEncoder.isConfigSupported({ codec: 'vp09.00.10.08', width: this.W, height: this.H, bitrate: vbr, framerate: this.FPS }); if (s.supported) vcodec = 'vp09.00.10.08'; } catch {}
      }
    }
    const acodec = vcodec ? await Exporter.pickAudio() : null;
    const files = [];
    for (let s = 0; s < scenes.length; s++) {
      const sc = scenes[s];
      const name = t(sc.key);
      const prog = (f) => onProgress && onProgress((s + f) / scenes.length);
      const audio = await this.audio(sc.chord);
      let blob; let ext;
      if (vcodec && acodec) { blob = await this.encodeFast(sc, audio, vcodec, acodec, prog); ext = 'mp4'; }
      else { const r = await this.encodeRealtime(sc, audio, prog); blob = r.blob; ext = r.ext; }
      files.push(new File([blob], `${name}.${ext}`, { type: blob.type || `video/${ext}`, lastModified: Date.now() }));
    }
    onProgress && onProgress(1);
    return files;
  },
  async encodeFast(sc, audio, vcodec, acodec, prog) {
    const { W, H, FPS, DUR } = this;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d', { alpha: false });
    const w = new MP4Writer({ W, H, fps: FPS, vcodec, vbr: 2500000, acodec });
    const N = DUR * FPS;
    for (let i = 0; i < N; i++) {
      sc.draw(g, i / FPS);
      w.addFrame(c);
      await w.drain(6);
      if (i % 15 === 0) prog(i / N * 0.95);
    }
    await w.addAudio(audio);
    return w.finish();
  },
  async encodeRealtime(sc, audio, prog) {
    const { W, H, FPS, DUR } = this;
    const types = [['video/mp4;codecs=avc1,mp4a.40.2', 'mp4'], ['video/webm;codecs=vp9,opus', 'webm'], ['video/webm;codecs=vp8,opus', 'webm'], ['video/webm', 'webm'], ['video/mp4', 'mp4']];
    const pick = types.find(([m]) => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
    if (!pick) throw new Error('no-encoder');
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d', { alpha: false });
    sc.draw(g, 0);
    const ac = Media.audioCtx();
    if (ac.state === 'suspended') await ac.resume().catch(() => {});
    const dest = ac.createMediaStreamDestination();
    const src = ac.createBufferSource(); src.buffer = audio; src.connect(dest);
    const vs = c.captureStream(FPS);
    const rec = new MediaRecorder(new MediaStream([...vs.getVideoTracks(), ...dest.stream.getAudioTracks()]), { mimeType: pick[0], videoBitsPerSecond: 2500000 });
    const chunks = []; rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    const stopped = new Promise((r) => { rec.onstop = r; });
    rec.start(250);
    const t0 = ac.currentTime + 0.05; src.start(t0);
    await new Promise((resolve) => {
      const loop = () => {
        const tt = ac.currentTime - t0;
        if (tt >= DUR) return resolve();
        sc.draw(g, Math.max(0, tt)); prog(Math.max(0, tt) / DUR);
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    });
    rec.stop(); await stopped;
    vs.getTracks().forEach((tr) => tr.stop());
    return { blob: new Blob(chunks, { type: pick[0].split(';')[0] }), ext: pick[1] };
  },
};

/* ===== store.js ===== */
/* =========================================================================
   store.js — progetti salvati sul dispositivo (IndexedDB) e sincronizzazione
   dei soli METADATI con l'account claude.ai (capability "db", spazio privato
   data/users/<id>). I file video non vengono mai inviati.
   ========================================================================= */
const Cloud = {
  state: 'init',          // init | guest | on | syncing | offline | readonly
  name: '',
  uid: null,
  db: null,
  listeners: new Set(),
  queue: new Map(),        // id progetto → ultimo progetto da inviare
  busy: new Set(),
  lastError: null,

  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  set(state) { this.state = state; for (const fn of this.listeners) { try { fn(state); } catch {} } },
  active() { return ['on', 'syncing', 'offline'].includes(this.state); },
  col() { return this.db.collection('data/users/' + this.uid); },
  docId(projectId) { return 'proj-' + projectId; },

  async init() {
    const [db, user] = await Promise.all([Platform.use('db'), Platform.use('user')]);
    if (!db || !user) { this.set('guest'); return; }
    try {
      this.uid = await user.id();
      this.name = (await user.name().catch(() => '')) || '';
    } catch { this.uid = null; }
    if (!this.uid) { this.set('guest'); return; }
    this.db = db;
    this.set('syncing');
    await this.pull();
  },

  /** Unisce i progetti del cloud con quelli locali (vince la modifica più recente). */
  async pull() {
    if (!this.db) return false;
    let snap;
    try {
      snap = await Promise.race([this.col().get(), sleep(12000).then(() => { throw Object.assign(new Error('timeout'), { code: 'unavailable' }); })]);
    } catch (e) { this.lastError = e; this.set(e && e.code === 'revoked' ? 'guest' : 'offline'); return false; }
    this.set('syncing');
    try {
      const local = new Map((await DB.all('projects')).map((p) => [p.id, p]));
      const remoteIds = new Set();
      for (const d of snap.docs) {
        if (!d.id.startsWith('proj-')) continue;
        const body = d.data() || {};
        const id = d.id.slice(5);
        remoteIds.add(id);
        const loc = local.get(id);
        if (body.deleted) {
          if (loc && !loc.deletedAt && (loc.updatedAt || 0) <= (body.updatedAt || 0)) await DB.del('projects', id);
          continue;
        }
        let remote = null;
        try { remote = Engine.migrate(JSON.parse(body.data)); } catch { remote = null; }
        if (!remote) continue;
        if (!loc || (remote.updatedAt || 0) > (loc.updatedAt || 0)) {
          if (loc && loc.thumb) remote.thumb = loc.thumb;
          remote.synced = true;
          await DB.put('projects', remote);
        }
      }
      // Progetti solo locali: li inviamo
      for (const p of local.values()) if (!remoteIds.has(p.id) && !p.deletedAt) this.push(p);
      this.set('on');
      return true;
    } catch (e) { ErrLog.add('cloud-pull', e); this.set('offline'); return false; }
  },

  push(project) {
    if (!this.db || this.state === 'readonly') return;
    this.queue.set(project.id, project);
    this._drain(project.id);
  },
  async _drain(id) {
    if (this.busy.has(id)) return;          // una scrittura per documento alla volta
    this.busy.add(id);
    try {
      while (this.queue.has(id)) {
        const p = this.queue.get(id); this.queue.delete(id);
        const data = JSON.stringify(Engine.toCloud(p));
        if (data.length > 240000) { this.lastError = new Error('too-large'); continue; }
        this.set('syncing');
        try {
          await this.col().doc(this.docId(id)).set({ v: 1, updatedAt: p.updatedAt, name: p.name.slice(0, 80), data });
          this.set('on');
        } catch (e) {
          this.lastError = e;
          if (e && e.code === 'invalid_argument') { this.set('readonly'); break; }
          if (e && e.code === 'revoked') { this.set('guest'); break; }
          this.set('offline');
          await sleep(4000 + Math.random() * 2000);
          if (!this.queue.has(id)) this.queue.set(id, p); // riprova con l'ultima versione
        }
      }
    } finally { this.busy.delete(id); }
  },
  async remove(id) {
    if (!this.db || this.state === 'readonly') return;
    this.queue.delete(id);
    try { await this.col().doc(this.docId(id)).set({ v: 1, deleted: true, updatedAt: Date.now() }); }
    catch (e) { this.lastError = e; }
  },
  async removeAll() {
    if (!this.db) return 0;
    const snap = await this.col().get();
    let n = 0;
    for (const d of snap.docs) if (d.id.startsWith('proj-')) { await this.col().doc(d.id).delete(); n++; }
    return n;
  },
};

const Store = {
  async list() {
    const all = await DB.all('projects');
    return all.filter((p) => !p.deletedAt).map((p) => Engine.migrate(p)).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  },
  async get(id) {
    const p = await DB.get('projects', id);
    return p && !p.deletedAt ? Engine.migrate(p) : null;
  },
  async save(p) {
    await DB.put('projects', p);
    Cloud.push(p);
  },
  async create(name) {
    const p = Engine.newProject(name, uid('p'), Date.now());
    await this.save(p);
    return p;
  },
  async uniqueName(base) {
    const names = new Set((await this.list()).map((p) => p.name));
    if (!names.has(base)) return base;
    for (let i = 2; i < 500; i++) { const n = `${base} ${i}`; if (!names.has(n)) return n; }
    return base;
  },
  async duplicate(id) {
    const src = await this.get(id);
    if (!src) return null;
    const now = Date.now();
    const copy = { ...JSON.parse(JSON.stringify(src)), id: uid('p'), name: await this.uniqueName(t('proj.copyOf', { name: src.name })), createdAt: now, updatedAt: now, synced: false };
    if (src.thumb) copy.thumb = src.thumb;
    await this.save(copy);
    return copy;
  },
  async rename(id, name) {
    const p = await this.get(id);
    if (!p) return;
    p.name = name.slice(0, 80); p.updatedAt = Date.now();
    await this.save(p);
  },
  /** Eliminazione in due tempi: subito nascosto, definitivo dopo il tempo per annullare. */
  async softDelete(id) {
    const p = await DB.get('projects', id);
    if (!p) return;
    p.deletedAt = Date.now();
    await DB.put('projects', p);
  },
  async restore(id) {
    const p = await DB.get('projects', id);
    if (!p) return;
    delete p.deletedAt;
    await DB.put('projects', p);
  },
  async finalizeDelete(id) {
    const p = await DB.get('projects', id);
    if (!p || !p.deletedAt) return;
    await DB.del('projects', id);
    await Cloud.remove(id);
    await Media.collectGarbage();
  },
  /** All'avvio completa le eliminazioni rimaste in sospeso. */
  async purgePending() {
    try {
      const all = await DB.all('projects');
      for (const p of all) if (p.deletedAt && Date.now() - p.deletedAt > 15000) { await DB.del('projects', p.id); await Cloud.remove(p.id); }
    } catch (e) { ErrLog.add('purge', e); }
  },
  mediaSize(p) { return Object.values(p.assets || {}).reduce((s, a) => s + (a.size || 0), 0); },
  /** Importa un backup .json come NUOVO progetto (nuovo id, nome univoco). I file si ricollegano all'apertura. */
  async importProject(file) {
    const p = await ProjectFile.parse(file);
    const now = Date.now();
    p.id = uid('p');
    p.name = await this.uniqueName(p.name);
    p.createdAt = p.createdAt || now; p.updatedAt = now; p.synced = false;
    delete p.deletedAt;
    await this.save(p);
    return p;
  },
};

/* ---------------------------------------------------------------------------
   Backup del progetto su disco (.json): struttura, tagli, effetti e marker.
   I file video, audio e immagine NON sono inclusi: si ricollegano all'apertura.
--------------------------------------------------------------------------- */
const ProjectFile = {
  MAX: 12 * 1024 * 1024,
  build(p) {
    return JSON.stringify({ app: 'EngimEdit', kind: 'project', schema: Engine.SCHEMA, exportedAt: new Date().toISOString(), project: Engine.toCloud(p), thumb: typeof p.thumb === 'string' && p.thumb.startsWith('data:image/') ? p.thumb : null }, null, 1);
  },
  fileName(p) { return ((p.name || 'progetto').replace(/[\\/:*?"<>|]+/g, ' ').trim().slice(0, 80) || 'progetto') + '.engimedit.json'; },
  download(p) { return saveFile(this.fileName(p), new Blob([this.build(p)], { type: 'application/json' })); },
  /** Legge e valida un backup. Errori: code = 'too-big' | 'invalid'. */
  async parse(file) {
    if (!file || file.size > this.MAX) throw Object.assign(new Error('too-big'), { code: 'too-big' });
    let obj;
    try { obj = JSON.parse(await file.text()); } catch { throw Object.assign(new Error('invalid'), { code: 'invalid' }); }
    const raw = obj && obj.app === 'EngimEdit' && obj.project ? obj.project : obj;
    if (!raw || typeof raw !== 'object' || !Array.isArray(raw.tracks) || typeof raw.assets !== 'object') throw Object.assign(new Error('invalid'), { code: 'invalid' });
    const p = Engine.migrate(raw);
    if (!p) throw Object.assign(new Error('invalid'), { code: 'invalid' });
    if (obj.thumb && typeof obj.thumb === 'string' && obj.thumb.startsWith('data:image/') && obj.thumb.length < 400000) p.thumb = obj.thumb;
    return p;
  },
};

/* ===== ui.js ===== */
/* =========================================================================
   ui.js — componenti del design system
   ========================================================================= */

/* ---------------- Tema ---------------- */
const Theme = {
  pref() { return Prefs.get('theme', 'dark'); },
  apply(pref = this.pref()) {
    const root = document.documentElement;
    let eff = pref;
    if (pref === 'system') {
      const host = root.getAttribute('data-theme');
      eff = host === 'dark' || host === 'light' ? host : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }
    root.setAttribute('data-ui', eff);
  },

    closable ? h('button', { class: 'btn btn-ghost btn-icon btn-sm', 'aria-label': t('common.close'), onclick: () => api.close(), html: icon('x') }) : null);
  const bodyEl = h('div', { class: 'modal-body' }); if (body) appendKids(bodyEl, [body]);

  dlg.append(head, bodyEl, footEl);
  document.body.appendChild(dlg);

  const api = {
    el: dlg, body: bodyEl, foot: footEl, head,

}

  cur: null,
  open(items, x, y, { returnFocus } = {}) {
    this.close();

    for (const it of items) {
      if (it === '-') { menu.appendChild(h('hr')); continue; }
      const b = h('button', { role: 'menuitem', class: it.danger ? 'danger' : '', 'aria-disabled': it.disabled ? 'true' : null, tabindex: '-1' });
      if (it.swatch) b.appendChild(h('span', { class: 'swatch', style: { '--sw': it.swatch }, 'aria-hidden': 'true' }));
      if (it.icon) b.appendChild(ic(it.icon));
      else if (it.swatch) b.appendChild(h('span', { class: 'menu-ic-gap', 'aria-hidden': 'true' }));
      b.appendChild(h('span', null, it.label));

      b.addEventListener('click', () => { if (it.disabled) return; this.close(); it.run && it.run(); });

const Tour = {
  active: false,
  start(steps, { onEnd } = {}) {
    this.end(true);

    this.steps = steps; this.i = 0; this.onEnd = onEnd;

    this.spot = h('div', { class: 'tour-spot' });

    this._onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); this.end(); } };

    document.addEventListener('keydown', this._onKey, true);

  },
  render() {
    const s = this.steps[this.i];

    const next = h('button', { class: 'btn btn-primary btn-sm', onclick: () => this.next() }, this.i === n - 1 ? t('tour.finish') : t('tour.next'));
    const foot = h('div', { class: 'foot' }, dots, h('div', { class: 'grow' }),
      this.i > 0 ? h('button', { class: 'btn btn-ghost btn-sm', onclick: () => this.prev() }, t('tour.back')) : h('button', { class: 'btn btn-ghost btn-sm', onclick: () => this.end() }, t('tour.skip')),
      next);
    const extra = s.action ? h('button', { class: 'btn btn-outline btn-sm', style: { marginTop: '12px' }, onclick: () => { const a = s.action; this.end(); a.run(); } }, s.action.label) : null;
    this.pop.append(h('div', { class: 'step' }, t('tour.step', { i: this.i + 1, n })), h('h3', { id: 'tour-h' }, s.title), h('p', null, s.text), extra, foot);
    this.place();
    setTimeout(() => next.focus(), 20);
  },
  place() {
    if (!this.active) return;
    const s = this.steps[this.i];
    const tg = typeof s.target === 'function' ? s.target() : $(s.target);
    const pw = this.pop.offsetWidth; const ph = this.pop.offsetHeight;
    if (!tg) {

    else if (space.below > ph + 24) { x = r.left; y = r.bottom + 18; }
    else if (space.above > ph + 24) { x = r.left; y = r.top - ph - 18; }
    else if (space.left > pw + 24) { x = r.left - pw - 18; y = r.top; }
    else { x = (innerWidth - pw) / 2; y = innerHeight - ph - 24; }
    Object.assign(this.pop.style, { left: clamp(x, 12, innerWidth - pw - 12) + 'px', top: clamp(y, 12, innerHeight - ph - 12) + 'px' });
  },
  next() { if (this.i < this.steps.length - 1) { this.i++; this.render(); } else this.end(); },
  prev() { if (this.i > 0) { this.i--; this.render(); } },
  end(silent) {
    if (!this.active) return;

    window.removeEventListener('resize', this._onResize);
    document.removeEventListener('keydown', this._onKey, true);
    this.shade.remove(); this.spot.remove(); this.pop.remove();
    if (!silent && this.onEnd) this.onEnd();
  },
};

  togglePreviewMute() {

  /** Prima / Dopo (Maiusc+D): disattiva temporaneamente le correzioni colore nell'anteprima. */
  toggleCompare() {

  /** Cattura fotogramma: PNG alla risoluzione piena del progetto, con tutte le correzioni. */
  async grabStill() {

  async toggleFullscreen() {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();

    } catch { Toast.show(t('ed.fsUnavailable'), { type: 'err' }); }
  }
  seek(t) { this.player.seek(Math.max(0, Math.min(this.total, t))); }
  step(dir, sec) {
    if (this.player.playing) this.player.pause();
    const d = sec || 1 / (this.project.fps || 30);
    const tt = Math.round((this.t + dir * d) * 30) / 30;
    this.seek(tt);
  }
  /** Clip V1 sotto il cursore: in modalità Riempi l'inquadratura si sposta trascinando. */
  setupPan() {
    let drag = null;
    const clipAtHead = () => { const loc = Engine.locate(this.clips, this.t); return loc && !loc.atEnd ? loc.clip : null; };
    this.frame.addEventListener('pointermove', () => {
      if (drag) return;
      const c = clipAtHead();
      this.frame.classList.toggle('pannable', !!(c && c.fit === 'fill' && this.panRange(c)));
    });
    this.frame.addEventListener('pointerdown', (e) => {
      const c = clipAtHead();
      if (!c || c.fit !== 'fill' || e.button !== 0) return;
      const rng = this.panRange(c);
      if (!rng) return;
      if (this.player.playing) this.player.pause();
      drag = { id: c.id, x: e.clientX, y: e.clientY, ox: c.ox || 0, oy: c.oy || 0, rng, rect: this.frame.getBoundingClientRect() };
      this.frame.setPointerCapture(e.pointerId); this.frame.classList.add('panning');
      this.beginLive();
    });
    this.frame.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const sx = drag.rect.width; const sy = drag.rect.height;
      // pixel dello schermo → valore di inquadratura (-1..1)
      const nx = drag.rng.x > 0 ? clamp(drag.ox - ((e.clientX - drag.x) / sx) * (2 / drag.rng.x), -1, 1) : 0;
      const ny = drag.rng.y > 0 ? clamp(drag.oy - ((e.clientY - drag.y) / sy) * (2 / drag.rng.y), -1, 1) : 0;
      const next = Engine.patch(this.clips, [drag.id], { ox: r4(nx), oy: r4(ny) });
      if (next) { this.setLive(next); this.renderProps(true); }
    });
    const end = () => { if (!drag) return; drag = null; this.frame.classList.remove('panning'); this.endLive(t('h.pan')); };
    this.frame.addEventListener('pointerup', end);
    this.frame.addEventListener('pointercancel', end);
  }
  /** Quanto la clip in modalità Riempi eccede il fotogramma (in frazioni del fotogramma). */
  panRange(c) {
    const a = this.project.assets[c.assetId]; if (!a || !a.width) return null;
    const f = Engine.FORMATS[this.project.format];
    const W = f.w; const H = f.h;
    const s = Math.max(W / a.width, H / a.height);
    const x = (a.width * s - W) / W; const y = (a.height * s - H) / H;
    return x > 0.005 || y > 0.005 ? { x, y } : null;
  }

  /* ---------------- Comandi di montaggio ---------------- */
  /** S: divide le clip selezionate sotto il cursore; se nessuna, la clip V1 al cursore. */
  split() {
    if (!this.hasClips()) return;
    if (this.player.playing) this.player.pause();
    const under = this.selected().filter(({ lane, clip }) => {
      const s = lane === 'v1' ? Engine.startOf(this.clips, clip.id) : clip.start || 0;
      return this.t > s + 1e-6 && this.t < s + Engine.dur(clip) - 1e-6 && lane !== 'v1';
    });
    if (under.length) { for (const u of under) this.splitClipAt(u.clip.id, this.t); return; }
    const res = Engine.split(this.clips, this.t, uid('c'));
    if (res.error) { Toast.show(res.error === 'edge' ? t('ed.splitEdge') : t('ed.splitNone'), { duration: 3500 }); return; }
    this.commit(t('h.split'), () => ({ clips: res.clips }));
    this.select([res.rightId]);
    Tips.show(this.tipSlot, 'trim', t('tip.trim'));
  }
  /** Divide una clip di qualsiasi traccia al tempo t (strumento Lametta). */
  splitClipAt(id, tt) {
    const f = this.findClip(id); if (!f) return false;
    const nid = uid('c');
    let res;
    if (f.lane === 'v1') {
      const st = Engine.startOf(this.clips, id);
      const local = tt - st;
      if (local < Engine.MIN_CLIP || Engine.dur(f.clip) - local < Engine.MIN_CLIP) { Toast.show(t('ed.splitEdge'), { duration: 2500 }); return false; }
      res = Engine.split(this.clips, tt, nid);
      if (res.error) return false;
      this.commit(t('h.split'), () => ({ clips: res.clips }));
    } else {
      res = Engine.splitFree(this.trackClips(f.lane), id, tt, nid);
      if (res.error) { Toast.show(t('ed.splitEdge'), { duration: 2500 }); return false; }
      this.commit(t('h.split'), () => ({ [TRACK_KEY[f.lane]]: res.clips }));
    }
    this.select([res.rightId]);
    return true;
  }
  deleteSel() {
    if (!this.sel.size) { Toast.show(t('ed.selectFirst'), { duration: 2500 }); return; }
    const n = this.sel.size;
    const first = this.clips.findIndex((c) => this.sel.has(c.id));
    const ok = this.commit(n > 1 ? t('h.deleteMany', { n }) : t('h.delete'), (s) => {
      const out = {};
      for (const key of ['clips', 'v2', 'a1']) { const r = Engine.remove(s[key], this.sel); if (r) out[key] = r; }
      return Object.keys(out).length ? out : null;
    });
    if (!ok) return;
    this.sel = new Set();
    const L = Engine.layout(this.clips);
    if (first >= 0 && L.length) this.seek(L[Math.min(first, L.length - 1)].start);
    this.renderTimeline(); this.renderProps(); this.renderHistoryButtons();
    Toast.show(n > 1 ? t('ed.deletedN', { n }) : t('ed.deleted'), { action: () => this.undo(), actionLabel: t('ed.undo'), duration: 5000 });
  }
  duplicateSel() {
    if (!this.sel.size) { Toast.show(t('ed.selectFirst'), { duration: 2500 }); return; }
    let newIds = [];
    this.commit(t('h.duplicate'), (s) => {
      const out = {};
      const r1 = Engine.duplicate(s.clips, this.sel, () => uid('c')); if (r1) { out.clips = r1.clips; newIds = newIds.concat(r1.newIds); }
      for (const key of ['v2', 'a1']) { const r = Engine.duplicateFree(s[key], this.sel, () => uid('c')); if (r) { out[key] = r.clips; newIds = newIds.concat(r.newIds); } }
      return Object.keys(out).length ? out : null;
    });
    if (newIds.length) this.select(newIds);
  }
  moveSel(dir) {
    if (this.sel.size !== 1) return;
    const id = [...this.sel][0];
    const f = this.findClip(id); if (!f) return;
    if (f.lane !== 'v1') {
      const step = dir * Math.max(1 / 30, 10 / this.pps);
      if (this.commit(t('h.move'), (s) => { const n = Engine.moveFree(s[TRACK_KEY[f.lane]], [id], step); return n ? { [TRACK_KEY[f.lane]]: n } : null; })) {
        const ref = this.clipEls.get(id); if (ref) ref.el.focus({ preventScroll: true });
      }
      return;
    }
    const i = this.clips.findIndex((c) => c.id === id);
    const gap = dir < 0 ? i - 1 : i + 2;
    if (gap < 0 || gap > this.clips.length) return;
    if (this.commit(t('h.move'), (s) => { const n = Engine.move(s.clips, [id], gap); return n ? { clips: n } : null; })) {
      this.seek(Engine.startOf(this.clips, id));
      const ref = this.clipEls.get(id); if (ref) ref.el.focus({ preventScroll: true });
    }
  }
  trimToHead(side) {
    const id = [...this.sel][0];
    const f = this.findClip(id); if (!f) return;
    const c = f.clip;
    const st = this.startOfClip(id);
    const v = Engine.sourceTime(c, this.t - st);
    const key = TRACK_KEY[f.lane];
    const fn = f.lane === 'v1' ? Engine.trim : Engine.trimFree;
    if (this.commit(t('h.trim'), (s) => { const n = fn(s[key], id, side, v, this.srcDur(c)); return n ? { [key]: n } : null; })) {
      this.seek(side === 'in' ? this.startOfClip(id) : this.t);
    }
  }
  /** D: attiva o disattiva le clip selezionate. */
  toggleDisabled() {
    const sel = this.selected();
    if (!sel.length) { Toast.show(t('ed.selectFirst'), { duration: 2500 }); return; }
    const off = !sel.every(({ clip }) => clip.disabled);
    this.commitSel(off ? t('h.disable') : t('h.enable'), { disabled: off });
    Toast.show(off ? t('ed.disabledN', { n: sel.length }) : t('ed.enabledN', { n: sel.length }), { duration: 2200 });
  }
  setLabel(color) { this.commitSel(t('h.label'), { label: color || undefined }); }
  /** Velocità delle clip selezionate (solo video e audio; in V2/A1 serve spazio libero). */
  setSpeed(sp) {
    const sel = this.selected().filter(({ clip }) => this.hasSource(clip));
    if (!sel.length) { Toast.show(t('speed.none'), { duration: 2500 }); return; }
    let blocked = 0;
    const ok = this.commit(t('h.speed', { s: sp }), (s) => {
      const out = {};
      for (const lane of ['v1', 'v2', 'a1']) {
        const key = TRACK_KEY[lane]; let arr = s[key];
        for (const { clip } of sel.filter((x) => x.lane === lane)) {
          if (lane !== 'v1') {
            const d = (clip.out - clip.in) / sp;
            if (Math.abs(Engine.fitFree(arr, [clip.id], clip.start || 0, d) - (clip.start || 0)) > 1e-6) { blocked++; continue; }
          }
          const n = Engine.patch(arr, [clip.id], { speed: sp }); if (n) arr = n;
        }
        if (arr !== s[key]) out[key] = arr;
      }
      return Object.keys(out).length ? out : null;
    });
    if (blocked) Toast.show(t('speed.blocked', { n: blocked }), { type: 'err', duration: 4000 });
    else if (ok) Toast.show(t('speed.done', { s: fmtSpeed(sp) }), { duration: 2000 });
  }
  openSpeedMenu(x, y) {
    const sel = this.selected().filter(({ clip }) => this.hasSource(clip));
    if (!sel.length) { Toast.show(t('speed.none'), { duration: 2500 }); return; }

    if (x === undefined) { const r = this.tlScroll.getBoundingClientRect(); x = r.left + 40; y = r.top + 10; }

  }
  /** Ctrl+C: copia gli attributi della clip selezionata. */
  copyAttrs() {
    const sel = this.selected();
    if (sel.length !== 1) { Toast.show(t('attr.selectOne'), { duration: 2500 }); return; }
    const c = sel[0].clip;
    this.attrClip = { attrs: Engine.pickAttrs(c), name: this.clipName(c) };
    Toast.show(t('attr.copied', { name: this.attrClip.name }), { type: 'ok', duration: 2500 });
  }
  rename(name) {
    const v = name.trim().slice(0, 80);
    if (!v) { this.nameInput.value = this.project.name; return; }
    if (v === this.project.name) return;
    this.project.name = v; this.markDirty();
    Toast.show(t('ed.renamed'), { type: 'ok', duration: 2000 });
  }
  /** Backup del progetto (struttura, senza i file) in JSON. */
  async exportProjectJson() {
    this.saveSoon.flush();
    try { const res = await ProjectFile.download(this.project); if (res === 'saved') Toast.show(t('proj.exported'), { type: 'ok', duration: 2500 }); }
    catch (e) { ErrLog.add('export-json', e); Toast.show(t('proj.exportFail'), { type: 'err' }); }
  }

  /* ---------------- Tastiera ---------------- */
  onKey(e) {
    if (this.destroyed || !this.project) return;
    if (document.querySelector('dialog[open]') || Tour.active || Menu.cur) return;
    if (isTyping(e)) return;
    if (getComputedStyle(this.ed).display === 'none') return;
    const mod = e.ctrlKey || e.metaKey;
    const k = e.key; const code = e.code;
    const handled = () => { e.preventDefault(); e.stopPropagation(); };
    if (mod && !e.shiftKey && (k === 'z' || k === 'Z')) { handled(); this.undo(); return; }
    if (mod && ((e.shiftKey && (k === 'z' || k === 'Z')) || k === 'y' || k === 'Y')) { handled(); this.redo(); return; }
    if (mod && (k === 'd' || k === 'D')) { handled(); this.duplicateSel(); return; }
    if (mod && (k === 's' || k === 'S')) { handled(); this.saveSoon.cancel(); this.saveNow().then(() => Toast.show(t('ed.savedNow'), { type: 'ok', duration: 2000 })); return; }
    if (mod && (k === 'e' || k === 'E')) { handled(); this.openExport(); return; }
    if (mod && (k === 'a' || k === 'A')) { handled(); this.select(this.project.tracks.flatMap((tr) => tr.clips.map((c) => c.id))); return; }
    if (mod && !e.shiftKey && !e.altKey && code === 'KeyC') { if (window.getSelection && String(window.getSelection())) return; handled(); this.copyAttrs(); return; }
    if (mod && !e.shiftKey && code === 'KeyR') { handled(); this.openSpeedMenu(); return; }
    if (mod) return;
    if (e.altKey && code === 'KeyV') { handled(); this.openPasteAttrs(); return; }
    if (e.shiftKey && code === 'KeyD') { handled(); this.toggleCompare(); return; }
    const inKnobOrRange = e.target && e.target.type === 'range';
    if (e.altKey && !['ArrowLeft', 'ArrowRight'].includes(k)) return;
    switch (k) {
      case ' ': if (e.target.tagName === 'BUTTON') return; handled(); this.player.toggle(); break;
      case 's': case 'S': handled(); this.split(); break;
      case 'Delete': case 'Backspace': handled(); this.deleteSel(); break;
      case 'ArrowLeft': case 'ArrowRight': {
        if (inKnobOrRange || e.target.getAttribute('role') === 'radio' || e.target.getAttribute('role') === 'separator' || e.target.getAttribute('role') === 'tab') return;
        handled();
        const dir = k === 'ArrowLeft' ? -1 : 1;
        if (e.altKey) this.moveSel(dir); else this.step(dir, e.shiftKey ? 1 : 0);
        break;
      }
      case 'ArrowUp': case 'ArrowDown':
        if (!e.shiftKey || inKnobOrRange) return;
        handled(); this.jumpMarker(k === 'ArrowUp' ? -1 : 1); break;
      case 'Home': handled(); this.seek(0); break;
      case 'End': handled(); this.seek(this.total); break;
      case '+': case '=': handled(); this.zoomBy(1.4); break;
      case '-': case '_': handled(); this.zoomBy(1 / 1.4); break;
      case '?': handled(); openShortcuts(); break;
      case 'f': case 'F': handled(); this.toggleFullscreen(); break;
      case 'a': case 'A': handled(); this.setTool('pointer'); break;
      case 'b': case 'B': handled(); this.setTool('blade'); break;
      case 't': case 'T': handled(); this.setTool('slip'); break;
      case 'n': case 'N': handled(); this.toggleSnap(); break;
      case 'm': case 'M': handled(); this.addMarker(); break;
      case 'd': case 'D': handled(); this.toggleDisabled(); break;
      case 'Escape': if (this.tool !== 'pointer') { handled(); this.setTool('pointer'); } else if (this.sel.size) { handled(); this.select([]); } break;
      default:
    }
  }

  /* ---------------- Trascinamento dal computer ---------------- */
  setupDrop() {
    let depth = 0;
    const hasFiles = (ev) => ev.dataTransfer && [...ev.dataTransfer.types].includes('Files');
    this.listen(window, 'dragenter', (ev) => {
      if (!hasFiles(ev)) return;
      ev.preventDefault(); depth++;
      if (!this.dropOverlay) {
        this.dropOverlay = h('div', { class: 'drop-overlay' }, h('div', null, h('span', { html: icon('upload') }), t('ed.dropHere'), h('p', { class: 'hint', style: { fontSize: '14px', fontWeight: 600, marginTop: '6px' } }, t('ed.dropHint'))));
        document.body.appendChild(this.dropOverlay);
      }
    });
    this.listen(window, 'dragover', (ev) => {
      if (!hasFiles(ev)) return;
      ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy';
      const tg = this.dropTarget(ev.clientX, ev.clientY, null);
      if (tg) this.showDropMark(tg); else this.insertMark.classList.add('hidden');
    });
    this.listen(window, 'dragleave', (ev) => { if (!hasFiles(ev)) return; depth = Math.max(0, depth - 1); if (!depth && this.dropOverlay) { this.dropOverlay.remove(); this.dropOverlay = null; this.insertMark.classList.add('hidden'); } });
    this.listen(window, 'drop', (ev) => {
      if (!hasFiles(ev)) return;
      ev.preventDefault(); depth = 0;
      if (this.dropOverlay) { this.dropOverlay.remove(); this.dropOverlay = null; }
      this.insertMark.classList.add('hidden');
      const files = [...ev.dataTransfer.files];
      const tg = this.dropTarget(ev.clientX, ev.clientY, null);
      this.importFiles(files, tg ? { lane: tg.lane, gap: tg.lane === 'v1' ? tg.gap : undefined, time: tg.lane === 'v1' ? undefined : tg.time } : null);
    });
  }

  /* ---------------- Pannelli ridimensionabili ---------------- */
  loadLayout() {
    const l = Prefs.get('layout', {}) || {};
    if (l.lib) this.ed.style.setProperty('--lib-w', l.lib + 'px');
    if (l.props) this.ed.style.setProperty('--props-w', l.props + 'px');
    if (l.tl) this.ed.style.setProperty('--tl-h', l.tl + 'px');
    this.renderSnap();
  }
  setupResizers() {
    const conf = [['.rz-l', '--lib-w', 'lib', 220, 440, 'x', 1], ['.rz-r', '--props-w', 'props', 270, 460, 'x', -1], ['.rz-t', '--tl-h', 'tl', 250, 560, 'y', -1]];
    for (const [sel, prop, key, mn, mx, axis, sign] of conf) {
      const el = $(sel, this.ed);
      const cur = () => parseFloat(getComputedStyle(this.ed).getPropertyValue(prop)) || mn;
      const set = (v) => {
        const lim = key === 'tl' ? Math.min(mx, innerHeight - 300) : mx;
        v = clamp(Math.round(v), mn, Math.max(mn, lim));
        this.ed.style.setProperty(prop, v + 'px');
        const l = Prefs.get('layout', {}) || {}; l[key] = v; Prefs.set('layout', l);
        el.setAttribute('aria-valuenow', String(v));
        this.layoutStage(); this.renderTimeline();
      };
      el.setAttribute('aria-valuemin', String(mn)); el.setAttribute('aria-valuemax', String(mx));
      el.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        const start = axis === 'x' ? e.clientX : e.clientY; const base = cur();
        el.classList.add('active'); el.setPointerCapture(e.pointerId);
        const mv = (ev) => set(base + ((axis === 'x' ? ev.clientX : ev.clientY) - start) * sign);
        const up = () => { el.classList.remove('active'); el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); };
        el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up);
      });
      el.addEventListener('keydown', (e) => {
        const d = { ArrowLeft: -16, ArrowRight: 16, ArrowUp: -16, ArrowDown: 16 }[e.key];
        if (d === undefined) return;
        e.preventDefault(); e.stopPropagation(); set(cur() + d * sign);
      });
    }
  }

  /* ---------------- Tutorial ---------------- */
  startTour(from = 0) {
    const steps = [
      { target: '[data-tour=add]', title: t('tour.s1t'), text: t('tour.s1'), action: !Object.keys(this.project.assets).length ? { label: t('ed.useSamples'), run: () => this.loadSamples() } : null },
      { target: () => $('.lib-item', this.libList) || $('[data-tour=library]'), title: t('tour.s2t'), text: t('tour.s2') },
      { target: '[data-tour=split]', title: t('tour.s3t'), text: t('tour.s3') },
      { target: '[data-tour=timeline]', title: t('tour.s4t'), text: t('tour.s4') },
      { target: '[data-tour=export]', title: t('tour.s5t'), text: t('tour.s5') },
    ];
    Tips.hide();

  }

  /* ---------------- Esportazione e ricollegamento ---------------- */
  openExport() {
    if (!this.hasClips()) { Toast.show(t('exp.empty'), { duration: 3000 }); return; }

  }
  openRelink() { RelinkDialog.open(this); }
}

/** Velocità leggibile: 0,25×, 1×, 1,5×… */
function fmtSpeed(sp) { return (Math.round(sp * 100) / 100).toLocaleString(I18N.locale()) + '×'; }

/* ===== timeline.js ===== */
/* =========================================================================
   timeline.js — timeline multitraccia dell'editor (metodi di Editor).
   Tracce: V2 (sovrapposizione), V1 (sequenza con ripple), A1 (audio).
   Strumenti: A Puntatore, B Lametta, T Slip, N Aggancio, M Marker.
   ========================================================================= */
const LABEL_VAR = { red: 'var(--danger)', amber: 'var(--warning)', green: 'var(--success)', violet: 'var(--accent)', lilac: 'var(--accent-2)', grey: 'var(--text-3)' };
const LANES = ['v2', 'v1', 'a1'];

Object.assign(Editor.prototype, {
  /* ======================= Costruzione ======================= */
  buildTimeline() {

  /* ======================= Disegno ======================= */

    for (const lane of ['v2', 'a1']) this.trackClips(lane).forEach((clip, index) => m.set(clip.id, { lane, start: clip.start || 0, end: Engine.endOf(clip), clip, index }));

  /** Marker della clip (in tempo sorgente: seguono la clip quando la sposti). */
  renderClipMarkers(ref) {

  /** Marker della timeline sul righello. */
  renderMarkers() {
    this.markersEl.textContent = '';
    for (const m of this.project.markers || []) {
      const b = h('button', { class: 'mk', style: { left: this.xOf(m.t) + 'px', '--mk': LABEL_VAR[m.color] }, 'aria-label': t('mk.label', { t: fmtTime(m.t), name: m.name || t('label.' + m.color) }), 'data-tip': m.name || t('mk.label', { t: fmtTime(m.t), name: t('label.' + m.color) }) });

      b.addEventListener('contextmenu', (e) => { e.preventDefault(); e.stopPropagation(); this.markerMenu({ id: m.id }, e.clientX, e.clientY); });
      b.addEventListener('keydown', (e) => { if (e.key === 'ContextMenu' || (e.shiftKey && e.key === 'F10') || e.key === 'Delete') { e.preventDefault(); e.stopPropagation(); if (e.key === 'Delete') this.removeMarker({ id: m.id }); else { const r = b.getBoundingClientRect(); this.markerMenu({ id: m.id }, r.left, r.bottom + 4, b); } } });

  /** Disegna miniature e forma d'onda solo nella parte visibile di ogni clip. */
  drawStrips() {
    if (!this.tlScroll) return;
    const sc = this.tlScroll; const vx0 = sc.scrollLeft - 100; const vx1 = sc.scrollLeft + sc.clientWidth + 100;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    for (const ref of this.clipEls.values()) {
      const c = ref.clip; const st = ref.start;
      if (st === undefined) continue;
      const H = ref.el.clientHeight;
      const x0 = this.xOf(st); const w = Engine.dur(c) * this.pps;
      const a = Math.max(x0, vx0); const b = Math.min(x0 + w, vx1);
      if (b <= a || H <= 0) { ref.strip.style.display = 'none'; continue; }
      const segL = a - x0; const segW = b - a;
      const kind = this.kindOfClip(c);
      const e = c.assetId ? Media.get(c.assetId) : null;
      const au = Engine.g(c, 'audio');
      const key = `${segL|0}|${segW|0}|${H}|${this.pps}|${c.in}|${c.out}|${c.speed}|${c.muted}|${c.volume}|${au.fadeIn}|${au.fadeOut}|${ref.lane}|${e ? e.thumbs.length : 0}|${e && e.peaks ? 1 : 0}`;
      ref.strip.style.display = 'block';
      if (ref.drawn === key) continue;
      ref.drawn = key;
      const cv = ref.strip;
      cv.style.left = segL + 'px'; cv.style.width = segW + 'px'; cv.style.height = H + 'px';
      cv.width = Math.max(1, Math.round(segW * dpr)); cv.height = Math.max(1, Math.round(H * dpr));
      const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);

      const hasWave = e.peaks && e.peaks.length && kind !== 'image';
      const thH = audioLane ? 0 : hasWave ? Math.round(H * 0.64) : H;
      const sp = c.speed || 1;

          const srcT = c.in + local * sp;
          let bi = 0; let bd = Infinity;
          for (let i = 0; i < e.thumbTimes.length; i++) { const d = Math.abs(e.thumbTimes[i] - srcT); if (d < bd) { bd = d; bi = i; } }
          const img = e.thumbs[bi] || th0;

        }
        g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(0, 0, segW, 22);
      }
      if (hasWave) {
        const top = audioLane ? 18 : thH;
        g.fillStyle = audioLane ? 'rgba(4,20,14,0.35)' : 'rgba(10,6,28,0.55)'; g.fillRect(0, top, segW, H - top);
        const mid = top + (H - top) / 2; const amp = (H - top) / 2 - 3;
        g.fillStyle = c.muted ? 'rgba(255,255,255,0.25)' : audioLane ? 'rgba(225,255,240,0.92)' : 'rgba(225,215,255,0.9)';
        const pps2 = e.pps || 100;

          const i0 = Math.floor(t0 * pps2); const i1 = Math.max(i0 + 1, Math.ceil(t1 * pps2));

          const lt = (segL + x) / this.pps;
          const hh = Math.max(1, Math.min(1, m * Engine.gainAt(c, lt)) * amp);
          g.fillRect(x, mid - hh, 1.4, hh * 2);
        }
        // dissolvenze: rampe visibili sulla forma d'onda
        const D = Engine.dur(c);

          const xa = from * this.pps - segL; const xb = to * this.pps - segL;
          if (xb < 0 || xa > segW) return;

          if (up) { g.moveTo(xa, top); g.lineTo(xb, top); g.lineTo(xa, H); } else { g.moveTo(xa, top); g.lineTo(xb, top); g.lineTo(xb, H); }

  },
  drawRuler() {
    const sc = this.tlScroll; const cv = this.rulerCanvas;
    const w = sc.clientWidth; const hh = 30; const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.style.left = sc.scrollLeft + 'px'; cv.style.width = w + 'px';
    if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = hh * dpr; }
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, hh);
    const steps = [0.1, 0.2, 0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 1200];
    const major = steps.find((s) => s * this.pps >= 84) || 1200;
    const minor = major * this.pps / 5 >= 10 ? major / 5 : major / 2;
    const css = getComputedStyle(this.root);

  /** Clic e trascinamento di una clip: V1 si riordina, V2/A1 si spostano nel tempo. */

          const tg = this.edgeTimes(fm.ids); tg.push(this.t);

          if (ss !== s0 && (se === e0 || Math.abs(ss - s0) <= Math.abs(se - e0))) delta += ss - s0; else if (se !== e0) delta += se - e0;

  /** Bersaglio di un rilascio: traccia, spazio di V1 o istante (V2/A1). kind = tipo di file, se noto. */

  clearDropMark() { for (const id of LANES) this.tracks[id].classList.remove('over'); this.tlEmpty.classList.remove('over'); this.insertMark.classList.add('hidden'); },
  /** Taglio dei bordi: V1 con ripple, V2/A1 senza invadere le clip vicine. */

    const ref = this.clipEls.get(id);
    const start = this.startOfClip(id);
    const sp = c.speed || 1;
    const lim = free ? Engine.freeTrimLimits(this.trackClips(f.lane), c, side, assetDur) : Engine.trimLimits(c, side, assetDur);
    const tip = h('div', { class: 'trim-tip tnum' });

    ref.el.classList.add('trimming');
    let val = side === 'in' ? c.in : c.out;
    const sx = e.clientX;
    const preview = f.lane === 'v1' && this.kindOfClip(c) === 'video';
    const onMove = (ev) => {
      const dt = (ev.clientX - sx) / this.pps;
      val = clamp((side === 'in' ? c.in : c.out) + dt * sp, lim.min, lim.max);

      }

      else { left = start; right = start + (val - c.in) / sp; }

  /** Slip (T): sposta la parte di sorgente usata, la durata in timeline resta uguale. */

  clipMenu(x, y, focusEl) {

  /* ======================= Marker ======================= */
  /** M: marker sulla clip selezionata (se il cursore è sopra) oppure sulla timeline. */
  addMarker() {
    const sel = this.selected();
    const tt = Math.round(this.t * 30) / 30;
    if (sel.length === 1) {
      const { lane, clip } = sel[0]; const st = this.startOfClip(clip.id);
      if (tt >= st - 1e-6 && tt <= st + Engine.dur(clip) + 1e-6) {
        const at = r4(Engine.sourceTime(clip, Math.max(0, tt - st)));
        const list = Array.isArray(clip.markers) ? clip.markers : [];
        if (list.some((m) => Math.abs(m.at - at) < 1 / 60)) { Toast.show(t('mk.exists'), { duration: 2000 }); return; }
        const key = TRACK_KEY[lane];
        this.commit(t('h.marker'), (s) => ({ [key]: Engine.patch(s[key], [clip.id], { markers: list.concat({ id: uid('m'), at, color: 'violet', name: '' }).sort((a, b) => a.at - b.at) }) }));
        Toast.show(t('mk.addedClip', { t: fmtTime(tt) }), { type: 'ok', duration: 2000 });
        return;
      }
    }
    const list = this.project.markers || [];
    if (list.some((m) => Math.abs(m.t - tt) < 1 / 60)) { Toast.show(t('mk.exists'), { duration: 2000 }); return; }
    this.commit(t('h.marker'), (s) => ({ markers: s.markers.concat({ id: uid('m'), t: tt, color: 'violet', name: '' }).sort((a, b) => a.t - b.t) }));

    const boxes = Object.keys(Engine.ATTR).map((g) => {
      const inp = h('input', { type: 'checkbox', checked: defaults[g], 'data-g': g });
