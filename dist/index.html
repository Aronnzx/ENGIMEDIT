<!doctype html>
<html lang="it" data-ui="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EngimEdit</title>
<meta name="description" content="EngimEdit: l'editor video nel browser per chi inizia. Taglia, dividi, unisci ed esporta in MP4. I video restano sul tuo computer.">
<meta name="theme-color" content="#0d0a1e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
/* Tema applicato prima del primo disegno, per evitare lampi di colore */
(function () {
  try {
    var r = document.documentElement, p = JSON.parse(localStorage.getItem('engimedit:theme') || '"dark"'), e = p;
    if (p === 'system') { var h = r.getAttribute('data-theme'); e = h === 'dark' || h === 'light' ? h : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
    r.setAttribute('data-ui', e === 'light' ? 'light' : 'dark');
  } catch (x) { /* archiviazione non disponibile: resta il tema scuro */ }
})();
</script>
<style>
/* =========================================================================
   EngimEdit — design system
   Token unici per colori, tipografia, spaziature, raggi, ombre e animazioni.
   Tema scuro = stile del marchio (mockup). Tema chiaro completo.
   ========================================================================= */
:root {
  color-scheme: light;
  --bg: #f5f3ff;
  --bg-glow-1: rgba(123, 92, 255, 0.14);
  --bg-glow-2: rgba(170, 120, 255, 0.10);
  --surface: #ffffff;
  --surface-2: #f2efff;
  --surface-3: #e7e2ff;
  --surface-glass: rgba(255, 255, 255, 0.86);
  --border: rgba(70, 48, 170, 0.14);
  --border-strong: rgba(70, 48, 170, 0.28);
  --text: #17132e;
  --text-2: #463f66;
  --text-3: #6a6390;
  --accent: #6a45f5;
  --accent-2: #8b6cff;
  --accent-ink: #ffffff;
  --accent-soft: rgba(106, 69, 245, 0.12);
  --accent-glow: rgba(106, 69, 245, 0.35);
  --grad: linear-gradient(135deg, #8b6cff 0%, #6a45f5 55%, #5a32e8 100%);
  --grad-text: linear-gradient(100deg, #6a45f5 0%, #9b5cff 60%, #c06bff 100%);
  --danger: #d6264a;
  --danger-soft: rgba(214, 38, 74, 0.10);
  --success: #0f8a5a;
  --success-soft: rgba(15, 138, 90, 0.12);
  --warning: #9a5b00;
  --warning-soft: rgba(230, 150, 20, 0.14);
  --clip-a: #7b5cff;
  --clip-b: #5d3fd6;
  --track-bg: #ece8ff;
  --ruler-tick: rgba(40, 30, 90, 0.35);
  --stage-bg: #e9e5fb;
  --shadow-1: 0 1px 2px rgba(23, 19, 46, 0.06), 0 2px 8px rgba(23, 19, 46, 0.05);
  --shadow-2: 0 10px 30px -12px rgba(40, 24, 120, 0.28);
  --shadow-3: 0 24px 60px -20px rgba(40, 24, 120, 0.40);

  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --fs-xs: 12px; --fs-sm: 13px; --fs-md: 14px; --fs-base: 15px; --fs-lg: 17px;
  --fs-xl: 20px; --fs-2xl: 24px; --fs-3xl: 32px; --fs-4xl: 44px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 72px;
  --r-xs: 6px; --r-sm: 9px; --r-md: 12px; --r-lg: 16px; --r-xl: 22px; --r-pill: 999px;
  --dur-1: 120ms; --dur-2: 200ms; --dur-3: 320ms;
  --ease: cubic-bezier(.2, .8, .2, 1);

  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
/* Tema scuro (stile del marchio). Lo script iniziale imposta data-ui="dark" o "light"
   in base alle Impostazioni (Scuro, Chiaro, Sistema); data-theme="dark" arriva dal visualizzatore. */
:root[data-theme="dark"], :root[data-ui="dark"] {
  color-scheme: dark;
  --bg: #0d0a1e;
  --bg-glow-1: rgba(123, 92, 255, 0.22);
  --bg-glow-2: rgba(176, 82, 255, 0.13);
  --surface: #15112b;
  --surface-2: #1c1738;
  --surface-3: #272049;
  --surface-glass: rgba(26, 21, 52, 0.78);
  --border: rgba(167, 139, 250, 0.15);
  --border-strong: rgba(167, 139, 250, 0.32);
  --text: #f4f2ff;
  --text-2: #c3bde3;
  --text-3: #938cb8;
  --accent: #7b5cff;
  --accent-2: #a78bfa;
  --accent-ink: #ffffff;
  --accent-soft: rgba(123, 92, 255, 0.18);
  --accent-glow: rgba(123, 92, 255, 0.55);
  --grad-text: linear-gradient(100deg, #a78bfa 0%, #8b6cff 45%, #c084fc 100%);
  --danger: #ff6b86;
  --danger-soft: rgba(255, 107, 134, 0.14);
  --success: #45dfa0;
  --success-soft: rgba(69, 223, 160, 0.14);
  --warning: #ffc266;
  --warning-soft: rgba(255, 194, 102, 0.14);
  --clip-a: #7b5cff;
  --clip-b: #4b2fc2;
  --track-bg: #120e26;
  --ruler-tick: rgba(200, 190, 255, 0.35);
  --stage-bg: #07050f;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-2: 0 14px 34px -14px rgba(0, 0, 0, 0.7);
  --shadow-3: 0 30px 80px -24px rgba(0, 0, 0, 0.8);
}
:root[data-ui="light"] {
  color-scheme: light;
  --bg: #f5f3ff; --bg-glow-1: rgba(123, 92, 255, 0.14); --bg-glow-2: rgba(170, 120, 255, 0.10);
  --surface: #ffffff; --surface-2: #f2efff; --surface-3: #e7e2ff; --surface-glass: rgba(255, 255, 255, 0.86);
  --border: rgba(70, 48, 170, 0.14); --border-strong: rgba(70, 48, 170, 0.28);
  --text: #17132e; --text-2: #463f66; --text-3: #6a6390;
  --accent: #6a45f5; --accent-2: #8b6cff; --accent-soft: rgba(106, 69, 245, 0.12); --accent-glow: rgba(106, 69, 245, 0.35);
  --grad-text: linear-gradient(100deg, #6a45f5 0%, #9b5cff 60%, #c06bff 100%);
  --danger: #d6264a; --danger-soft: rgba(214, 38, 74, 0.10); --success: #0f8a5a; --success-soft: rgba(15, 138, 90, 0.12);
  --warning: #9a5b00; --warning-soft: rgba(230, 150, 20, 0.14);
  --track-bg: #ece8ff; --ruler-tick: rgba(40, 30, 90, 0.35); --stage-bg: #e9e5fb;
  --shadow-1: 0 1px 2px rgba(23, 19, 46, 0.06), 0 2px 8px rgba(23, 19, 46, 0.05);
  --shadow-2: 0 10px 30px -12px rgba(40, 24, 120, 0.28); --shadow-3: 0 24px 60px -20px rgba(40, 24, 120, 0.40);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; height: 100%; font-family: var(--font); font-size: var(--fs-base); line-height: 1.5;
  color: var(--text); background: var(--bg);
  background-image: radial-gradient(1100px 620px at 8% -12%, var(--bg-glow-1), transparent 62%),
                    radial-gradient(900px 560px at 108% 112%, var(--bg-glow-2), transparent 60%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
img, svg, video, canvas { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-2); text-underline-offset: 3px; }
:root[data-ui="light"] a { color: var(--accent); }
h1, h2, h3, h4 { margin: 0; line-height: 1.15; letter-spacing: -0.02em; }
p { margin: 0; }
::selection { background: var(--accent-soft); }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-3); }
.hidden { display: none !important; }
* { scrollbar-width: thin; scrollbar-color: var(--surface-3) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; scroll-behavior: auto !important; }
}

/* ---------- Logo ---------- */
.logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); font-weight: 800; letter-spacing: 0.04em; font-size: 19px; }
.logo svg { width: 30px; height: 30px; filter: drop-shadow(0 0 10px var(--accent-glow)); flex: none; }

/* ---------- Bottoni ---------- */
.btn {
  --h: 40px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: var(--h); padding: 0 16px; border-radius: var(--r-md); border: 1px solid transparent;
  font-weight: 600; font-size: var(--fs-md); white-space: nowrap; cursor: pointer; user-select: none;
  transition: background var(--dur-1) var(--ease), border-color var(--dur-1), box-shadow var(--dur-2), transform var(--dur-1), color var(--dur-1), opacity var(--dur-1);
  background: var(--surface-2); color: var(--text); border-color: var(--border); text-decoration: none;
}
.btn svg { width: 18px; height: 18px; flex: none; }
.btn:hover { border-color: var(--border-strong); background: var(--surface-3); }
.btn:active { transform: translateY(1px); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--grad); color: var(--accent-ink); border-color: rgba(255,255,255,0.12); box-shadow: 0 10px 26px -10px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.22); }
.btn-primary:hover { background: var(--grad); filter: brightness(1.08); border-color: rgba(255,255,255,0.22); box-shadow: 0 14px 32px -10px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.28); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--accent-soft); color: var(--text); border-color: transparent; }
.btn-outline { background: transparent; border-color: var(--border-strong); }
.btn-outline:hover { background: var(--accent-soft); }
.btn-danger { background: var(--danger); color: #fff; border-color: transparent; }
.btn-danger:hover { background: var(--danger); filter: brightness(1.08); }
.btn-sm { --h: 32px; padding: 0 11px; font-size: var(--fs-sm); border-radius: var(--r-sm); }
.btn-lg { --h: 50px; padding: 0 24px; font-size: var(--fs-base); border-radius: var(--r-lg); }
.btn-icon { width: var(--h); padding: 0; }
.btn.is-active { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
.btn .spinner { width: 16px; height: 16px; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin 0.8s linear infinite; display: inline-block; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Campi ---------- */
.field { display: grid; gap: 6px; }
.label { font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); }
.hint { font-size: var(--fs-xs); color: var(--text-3); }
.input, .select {
  height: 40px; padding: 0 12px; border-radius: var(--r-md); border: 1px solid var(--border-strong);
  background: var(--surface); color: var(--text); width: 100%; transition: border-color var(--dur-1), box-shadow var(--dur-1);
}
.input:hover, .select:hover { border-color: var(--accent-2); }
.input:focus, .select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input[aria-invalid="true"] { border-color: var(--danger); }
.select { appearance: none; padding-right: 34px; background-image: linear-gradient(45deg, transparent 50%, var(--text-3) 50%), linear-gradient(135deg, var(--text-3) 50%, transparent 50%); background-position: calc(100% - 18px) 17px, calc(100% - 13px) 17px; background-size: 5px 5px; background-repeat: no-repeat; }

.seg { display: inline-flex; padding: 3px; gap: 3px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md); }
.seg button { border: 0; background: transparent; color: var(--text-2); height: 30px; padding: 0 11px; border-radius: var(--r-sm); font-weight: 600; font-size: var(--fs-sm); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background var(--dur-1), color var(--dur-1); }
.seg button:hover { color: var(--text); background: var(--accent-soft); }
.seg button[aria-pressed="true"], .seg button[aria-checked="true"] { background: var(--grad); color: #fff; box-shadow: 0 6px 16px -8px var(--accent-glow); }
.seg button small { font-weight: 500; opacity: 0.8; font-size: 11px; }

.switch { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: var(--fs-sm); color: var(--text-2); }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 36px; height: 20px; border-radius: 20px; background: var(--surface-3); border: 1px solid var(--border-strong); position: relative; transition: background var(--dur-2); flex: none; }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--text-3); transition: transform var(--dur-2) var(--ease), background var(--dur-2); }
.switch input:checked + .track { background: var(--accent); border-color: var(--accent); }
.switch input:checked + .track::after { transform: translateX(16px); background: #fff; }
.switch input:focus-visible + .track { outline: 2px solid var(--accent-2); outline-offset: 2px; }

input[type="range"].range { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; cursor: pointer; --p: 50%; }
input[type="range"].range::-webkit-slider-runnable-track { height: 5px; border-radius: 5px; background: linear-gradient(90deg, var(--accent) var(--p), var(--surface-3) var(--p)); }
input[type="range"].range::-moz-range-track { height: 5px; border-radius: 5px; background: var(--surface-3); }
input[type="range"].range::-moz-range-progress { height: 5px; border-radius: 5px; background: var(--accent); }
input[type="range"].range::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); margin-top: -5.5px; box-shadow: 0 0 0 4px var(--accent-soft); }
input[type="range"].range::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); }
input[type="range"].range:focus-visible { outline: none; }
input[type="range"].range:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 5px var(--accent-glow); }

.kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 6px; border: 1px solid var(--border-strong); background: var(--surface-2); font-size: 11px; font-weight: 700; color: var(--text-2); font-family: var(--font); }
.badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: var(--r-pill); font-size: 11.5px; font-weight: 700; background: var(--accent-soft); color: var(--accent-2); }
:root[data-ui="light"] .badge { color: var(--accent); }
.badge.warn { background: var(--warning-soft); color: var(--warning); }
.badge.err { background: var(--danger-soft); color: var(--danger); }
.badge.ok { background: var(--success-soft); color: var(--success); }

/* ---------- Pannelli ---------- */
.panel { background: linear-gradient(180deg, var(--surface-glass), var(--surface-glass)); border: 1px solid var(--border); border-radius: var(--r-xl); box-shadow: var(--shadow-1); }

/* ---------- Modali ---------- */
dialog.modal { border: 1px solid var(--border-strong); border-radius: var(--r-xl); padding: 0; background: var(--surface); color: var(--text); box-shadow: var(--shadow-3); width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: hidden; }
dialog.modal.wide { width: min(860px, calc(100vw - 32px)); }
dialog.modal[open] { display: flex; flex-direction: column; animation: pop var(--dur-3) var(--ease); }
dialog.modal::backdrop { background: rgba(8, 5, 22, 0.62); backdrop-filter: blur(4px); }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(0.985); } to { opacity: 1; transform: none; } }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 22px 24px 8px; }
.modal-head h2 { font-size: var(--fs-xl); }
.modal-head p { color: var(--text-2); margin-top: 6px; font-size: var(--fs-md); }
.modal-body { padding: 12px 24px; overflow: auto; display: grid; gap: 16px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 24px 22px; flex-wrap: wrap; }
.modal-foot .spacer { flex: 1; }

/* ---------- Toast ---------- */
.toasts { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; gap: 8px; z-index: 90; pointer-events: none; width: min(520px, calc(100vw - 32px)); }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 11px 12px 11px 16px; border-radius: var(--r-lg); background: var(--surface-3); color: var(--text); border: 1px solid var(--border-strong); box-shadow: var(--shadow-3); font-size: var(--fs-md); animation: pop var(--dur-2) var(--ease); }
.toast .t-ic { width: 20px; height: 20px; flex: none; color: var(--accent-2); }
.toast.err .t-ic { color: var(--danger); }
.toast.ok .t-ic { color: var(--success); }
.toast .t-msg { flex: 1; }
.toast .btn { --h: 30px; }

/* ---------- Tooltip ---------- */
.tooltip { position: fixed; z-index: 100; pointer-events: none; padding: 6px 9px; border-radius: 8px; background: #221c44; color: #f4f2ff; font-size: 12.5px; font-weight: 600; display: flex; gap: 8px; align-items: center; box-shadow: 0 10px 26px -10px rgba(0,0,0,0.6); border: 1px solid rgba(167,139,250,0.25); opacity: 0; transform: translateY(3px); transition: opacity var(--dur-1), transform var(--dur-1); max-width: 280px; }
.tooltip.show { opacity: 1; transform: none; }
.tooltip .kbd { background: rgba(255,255,255,0.08); color: #e6e1ff; border-color: rgba(255,255,255,0.18); height: 19px; min-width: 19px; }

/* ---------- Menu ---------- */
.menu { position: fixed; z-index: 95; min-width: 220px; padding: 6px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--border-strong); box-shadow: var(--shadow-3); animation: pop var(--dur-1) var(--ease); }
.menu [role="menuitem"] { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: var(--r-sm); border: 0; background: transparent; text-align: left; cursor: pointer; font-size: var(--fs-md); color: var(--text); }
.menu [role="menuitem"] svg { width: 17px; height: 17px; color: var(--text-3); flex: none; }
.menu [role="menuitem"] .kbd { margin-left: auto; }
.menu [role="menuitem"]:hover, .menu [role="menuitem"]:focus { background: var(--accent-soft); outline: none; }
.menu [role="menuitem"][aria-disabled="true"] { opacity: 0.4; cursor: default; background: transparent; }
.menu [role="menuitem"].danger { color: var(--danger); }
.menu [role="menuitem"].danger svg { color: var(--danger); }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: 5px 4px; }

/* ---------- Progresso / skeleton ---------- */
.progress { height: 8px; border-radius: 8px; background: var(--surface-3); overflow: hidden; }
.progress > span { display: block; height: 100%; width: 0; background: var(--grad); border-radius: 8px; transition: width 180ms linear; box-shadow: 0 0 14px var(--accent-glow); }
.progress.indeterminate > span { width: 35%; animation: indet 1.2s var(--ease) infinite; }
@keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
.skeleton { background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; border-radius: var(--r-sm); }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ---------- Stato vuoto ---------- */
.empty { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 28px 20px; color: var(--text-2); }
.empty .art { width: 120px; height: 96px; margin-bottom: 6px; }
.empty h3 { font-size: var(--fs-lg); color: var(--text); }
.empty p { font-size: var(--fs-md); max-width: 40ch; }
.empty .actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }

/* =========================================================================
   LANDING
   ========================================================================= */
.lp { min-height: 100%; }
.lp-nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; backdrop-filter: blur(14px); background: color-mix(in srgb, var(--bg) 72%, transparent); border-bottom: 1px solid var(--border); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--bg); }
.lp-nav .in { max-width: 1180px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; gap: 24px; }
.lp-nav nav { display: flex; gap: 4px; margin-left: auto; }
.lp-nav nav a { color: var(--text-2); text-decoration: none; font-weight: 600; font-size: var(--fs-md); padding: 8px 12px; border-radius: var(--r-sm); }
.lp-nav nav a:hover { color: var(--text); background: var(--accent-soft); }
.lp-wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
.lp-hero { display: grid; grid-template-columns: 1.05fr 1fr; gap: 40px; align-items: center; padding: 72px 0 64px; }
.lp-hero h1 { font-size: clamp(40px, 5.4vw, 66px); font-weight: 800; letter-spacing: -0.035em; line-height: 1.02; }
.lp-hero h1 .grad { background: var(--grad-text); -webkit-background-clip: text; background-clip: text; color: transparent; display: block; padding-bottom: 6px; }
.lp-hero .sub { margin-top: 20px; font-size: var(--fs-lg); color: var(--text-2); max-width: 46ch; line-height: 1.6; }
.lp-hero .cta { display: flex; gap: 12px; margin-top: 30px; flex-wrap: wrap; }
.lp-hero .facts { display: flex; gap: 22px; margin-top: 28px; flex-wrap: wrap; color: var(--text-2); font-size: var(--fs-md); font-weight: 600; }
.lp-hero .facts span { display: inline-flex; align-items: center; gap: 8px; }
.lp-hero .facts svg { width: 18px; height: 18px; color: var(--accent-2); }
.hero-art { position: relative; aspect-ratio: 1.1; }
.hero-art svg { width: 100%; height: 100%; }
.hero-art .ph { animation: sweep 6s ease-in-out infinite; }
@keyframes sweep { 0% { transform: translateX(0); } 50% { transform: translateX(212px); } 100% { transform: translateX(0); } }
.lp-section { padding: 72px 0; border-top: 1px solid var(--border); }
.lp-section > h2, .lp-section .h2 { font-size: clamp(28px, 3.2vw, 40px); font-weight: 800; max-width: 22ch; }
.lp-section .lead { color: var(--text-2); font-size: var(--fs-lg); margin-top: 12px; max-width: 60ch; }
.steps { list-style: none; padding: 0; margin: 40px 0 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; counter-reset: s; }
.steps li { position: relative; padding: 26px 24px 24px; border-radius: var(--r-xl); background: var(--surface-glass); border: 1px solid var(--border); counter-increment: s; }
.steps li::before { content: counter(s); display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--grad); color: #fff; font-weight: 800; box-shadow: 0 10px 24px -10px var(--accent-glow); margin-bottom: 18px; }
.steps h3 { font-size: var(--fs-xl); }
.steps p { color: var(--text-2); margin-top: 8px; }
.steps .kbd { margin: 0 2px; }
.benefits { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0; margin-top: 36px; border-top: 1px solid var(--border); }
.benefits > div { display: grid; grid-template-columns: 44px 1fr; gap: 16px; padding: 26px 8px 26px 0; border-bottom: 1px solid var(--border); }
.benefits > div:nth-child(odd) { padding-right: 32px; border-right: 1px solid var(--border); }
.benefits > div:nth-child(even) { padding-left: 32px; }
.benefits .ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-2); }
:root[data-ui="light"] .benefits .ic { color: var(--accent); }
.benefits .ic svg { width: 22px; height: 22px; }
.benefits h3 { font-size: var(--fs-lg); }
.benefits p { color: var(--text-2); margin-top: 4px; }
.cmp-wrap { overflow-x: auto; margin-top: 32px; border-radius: var(--r-xl); border: 1px solid var(--border); background: var(--surface-glass); }
.cmp { width: 100%; border-collapse: collapse; min-width: 640px; font-size: var(--fs-md); }
.cmp th, .cmp td { padding: 14px 18px; text-align: left; border-bottom: 1px solid var(--border); }
.cmp thead th { font-size: var(--fs-sm); color: var(--text-2); font-weight: 700; }
.cmp thead th.me { color: var(--text); }
.cmp td.me { background: var(--accent-soft); font-weight: 600; }
.cmp tr:last-child td { border-bottom: 0; }
.cmp .y, .cmp .n { display: inline-flex; align-items: center; gap: 6px; }
.cmp .y svg { width: 18px; height: 18px; color: var(--success); }
.cmp .n svg { width: 18px; height: 18px; color: var(--text-3); }
.faq { margin-top: 28px; display: grid; gap: 10px; max-width: 820px; }
.faq details { border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface-glass); }
.faq summary { cursor: pointer; list-style: none; padding: 18px 20px; font-weight: 700; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary svg { width: 18px; height: 18px; transition: transform var(--dur-2) var(--ease); color: var(--text-3); flex: none; }
.faq details[open] summary svg { transform: rotate(180deg); }
.faq details p { padding: 0 20px 18px; color: var(--text-2); max-width: 70ch; }
.lp-final { margin: 0 0 72px; padding: 44px; border-radius: 28px; background: var(--grad); color: #fff; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; box-shadow: 0 30px 70px -30px var(--accent-glow); }
.lp-final h2 { font-size: clamp(26px, 3vw, 36px); max-width: 20ch; }
.lp-final p { opacity: 0.9; margin-top: 8px; }
.lp-final .btn { background: #fff; color: #3b1fb8; border: 0; }
.lp-final .btn:hover { background: #f1edff; }
.lp-foot { border-top: 1px solid var(--border); padding: 32px 0 40px; color: var(--text-3); font-size: var(--fs-sm); }
.lp-foot .in { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
.lp-foot nav { display: flex; gap: 16px; flex-wrap: wrap; margin-left: auto; }
.lp-foot a { color: var(--text-2); text-decoration: none; }
.lp-foot a:hover { color: var(--text); text-decoration: underline; }
.lang-switch { display: inline-flex; gap: 4px; }

/* =========================================================================
   SHELL APP (dashboard, impostazioni, aiuto)
   ========================================================================= */
.shell { display: grid; grid-template-columns: 252px 1fr; height: 100%; gap: 16px; padding: 16px; }
.sidebar { display: flex; flex-direction: column; gap: 6px; padding: 20px 14px; border-radius: var(--r-xl); background: var(--surface-glass); border: 1px solid var(--border); overflow: auto; }
.sidebar .logo { padding: 0 8px 18px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: var(--r-md); color: var(--text-2); text-decoration: none; font-weight: 600; border: 1px solid transparent; transition: background var(--dur-1), color var(--dur-1); }
.nav-item svg { width: 20px; height: 20px; flex: none; }
.nav-item:hover { background: var(--accent-soft); color: var(--text); }
.nav-item[aria-current="page"] { background: var(--grad); color: #fff; border-color: rgba(255,255,255,0.14); box-shadow: 0 10px 24px -12px var(--accent-glow); }
.sidebar .sep { height: 1px; background: var(--border); margin: 10px 6px; }
.sidebar .grow { flex: 1; }
.acct { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: var(--r-lg); border: 1px solid var(--border); background: var(--surface-2); }
.avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--grad); color: #fff; font-weight: 800; flex: none; }
.acct .who { min-width: 0; }
.acct .who b { display: block; font-size: var(--fs-md); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acct .who span { font-size: var(--fs-xs); color: var(--text-3); display: flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); display: inline-block; flex: none; }
.dot.on { background: var(--success); box-shadow: 0 0 8px var(--success); }
.dot.warn { background: var(--warning); }
.main { overflow: auto; border-radius: var(--r-xl); min-width: 0; }
.main-in { max-width: 1240px; margin: 0 auto; padding: 8px 8px 48px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 8px 0 22px; flex-wrap: wrap; }
.page-head h1 { font-size: var(--fs-3xl); font-weight: 800; }
.page-head p { color: var(--text-2); margin-top: 6px; }

.dash-hero { position: relative; overflow: hidden; display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; align-items: center; padding: 36px 40px; border-radius: 26px; border: 1px solid var(--border); background: linear-gradient(120deg, var(--surface-2), var(--surface)); box-shadow: var(--shadow-2); }
.dash-hero::after { content: ""; position: absolute; inset: auto -10% -60% 40%; height: 120%; background: radial-gradient(closest-side, var(--accent-glow), transparent); opacity: 0.45; pointer-events: none; }
.dash-hero h1 { font-size: clamp(30px, 3.4vw, 44px); font-weight: 800; letter-spacing: -0.03em; }
.dash-hero h1 .grad { background: var(--grad-text); -webkit-background-clip: text; background-clip: text; color: transparent; }
.dash-hero p { color: var(--text-2); margin-top: 10px; font-size: var(--fs-lg); max-width: 44ch; }
.dash-hero .cta { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; position: relative; z-index: 1; }
.dash-hero .art { position: relative; z-index: 1; }
.dash-hero .art svg { width: 100%; max-height: 220px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 36px 0 16px; flex-wrap: wrap; }
.section-head h2 { font-size: var(--fs-xl); font-weight: 800; display: flex; gap: 10px; align-items: center; }
.section-head h2 svg { width: 22px; height: 22px; color: var(--accent-2); }
.proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 18px; }
.proj-card { position: relative; border-radius: var(--r-lg); border: 1px solid var(--border); background: var(--surface); overflow: hidden; transition: border-color var(--dur-2), transform var(--dur-2) var(--ease), box-shadow var(--dur-2); }
.proj-card:hover { border-color: var(--accent); box-shadow: 0 18px 40px -22px var(--accent-glow); transform: translateY(-2px); }
.proj-card .open { display: block; width: 100%; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; color: inherit; }
.proj-card .thumb { aspect-ratio: 16 / 9; background: var(--stage-bg); display: grid; place-items: center; overflow: hidden; position: relative; }
.proj-card .thumb img { width: 100%; height: 100%; object-fit: cover; }
.proj-card .thumb .ph { width: 100%; height: 100%; display: grid; place-items: center; background: linear-gradient(135deg, var(--surface-3), var(--surface-2)); color: var(--accent-2); font-size: 34px; font-weight: 800; }
.proj-card .thumb .fmt { position: absolute; left: 10px; top: 10px; }
.proj-card .meta { padding: 12px 44px 14px 14px; }
.proj-card .meta b { display: block; font-size: var(--fs-md); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proj-card .meta span { font-size: var(--fs-xs); color: var(--text-3); }
.proj-card .more { position: absolute; right: 8px; bottom: 10px; }
.proj-card.new { display: grid; place-items: center; min-height: 190px; border-style: dashed; border-color: var(--border-strong); background: transparent; color: var(--text-2); cursor: pointer; font-weight: 700; gap: 8px; }
.proj-card.new:hover { color: var(--text); background: var(--accent-soft); }
.proj-card.new svg { width: 30px; height: 30px; color: var(--accent-2); }
.notice { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r-lg); border: 1px solid var(--border); background: var(--surface-2); font-size: var(--fs-md); color: var(--text-2); }
.notice svg { width: 20px; height: 20px; flex: none; color: var(--accent-2); margin-top: 1px; }
.notice.warn { background: var(--warning-soft); border-color: transparent; color: var(--text); }
.notice.warn svg { color: var(--warning); }
.notice.err { background: var(--danger-soft); border-color: transparent; color: var(--text); }
.notice.err svg { color: var(--danger); }

.settings-sec { padding: 24px; border-radius: var(--r-xl); border: 1px solid var(--border); background: var(--surface-glass); margin-bottom: 18px; display: grid; gap: 16px; }
.settings-sec h2 { font-size: var(--fs-lg); font-weight: 800; }
.settings-sec .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.settings-sec .row > div:first-child { min-width: 0; }
.settings-sec .row b { display: block; }
.settings-sec .row span { color: var(--text-3); font-size: var(--fs-sm); }
.store-bar { height: 10px; border-radius: 10px; background: var(--surface-3); overflow: hidden; }
.store-bar span { display: block; height: 100%; background: var(--grad); }
.table { width: 100%; border-collapse: collapse; font-size: var(--fs-md); }
.table th, .table td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
.table th { color: var(--text-3); font-weight: 700; font-size: var(--fs-sm); }
.short-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 24px; }
.short-list div { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: var(--fs-md); }
.short-list .keys { display: flex; gap: 4px; flex: none; }

.doc { max-width: 760px; margin: 0 auto; padding: 40px 24px 64px; }
.doc h1 { font-size: var(--fs-3xl); font-weight: 800; margin-bottom: 8px; }
.doc .upd { color: var(--text-3); font-size: var(--fs-sm); margin-bottom: 24px; }
.doc h2 { font-size: var(--fs-xl); margin: 32px 0 10px; }
.doc p, .doc li { color: var(--text-2); line-height: 1.7; }
.doc p + p { margin-top: 12px; }
.doc ul { padding-left: 20px; }
.doc .back { margin-bottom: 24px; }

.nf { min-height: 100%; display: grid; place-items: center; padding: 40px 24px; text-align: center; }
.nf .code { font-size: clamp(90px, 16vw, 170px); font-weight: 800; letter-spacing: -0.05em; line-height: 1; background: var(--grad-text); -webkit-background-clip: text; background-clip: text; color: transparent; }
.nf h1 { font-size: var(--fs-2xl); margin: 10px 0 8px; }
.nf p { color: var(--text-2); margin-bottom: 22px; }

.gate { display: none; }
.ed-wrap { height: 100%; }

/* =========================================================================
   EDITOR
   ========================================================================= */
.ed { --lib-w: 284px; --props-w: 300px; --tl-h: 280px; height: 100%; display: grid; grid-template-rows: 60px minmax(0, 1fr) 6px var(--tl-h); grid-template-columns: var(--lib-w) 6px minmax(0, 1fr) 6px var(--props-w); grid-template-areas: "top top top top top" "lib rl center rr props" "rt rt rt rt rt" "tl tl tl tl tl"; gap: 0; padding: 0 10px 10px; }
.ed.no-props { grid-template-columns: var(--lib-w) 6px minmax(0, 1fr) 0 0; }
.ed.no-props .ed-props, .ed.no-props .rz-r { display: none; }
.ed-top { grid-area: top; display: flex; align-items: center; gap: 10px; padding: 0 4px; min-width: 0; }
.ed-top .logo { font-size: 16px; gap: 8px; }
.ed-top .logo svg { width: 26px; height: 26px; }
.ed-top .vsep { width: 1px; height: 26px; background: var(--border); margin: 0 4px; }
.pname { min-width: 120px; max-width: 340px; height: 36px; padding: 0 10px; border-radius: var(--r-sm); border: 1px solid transparent; background: transparent; font-weight: 700; font-size: var(--fs-base); color: var(--text); text-overflow: ellipsis; }
.pname:hover { border-color: var(--border); }
.pname:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.save-state { display: inline-flex; align-items: center; gap: 7px; font-size: var(--fs-sm); color: var(--text-3); white-space: nowrap; }
.save-state svg { width: 16px; height: 16px; }
.save-state.ok svg { color: var(--success); }
.save-state.warn svg { color: var(--warning); }
.ed-top .grow { flex: 1; }
.ed-top .btn-export { padding: 0 20px; }

.pane { background: var(--surface-glass); border: 1px solid var(--border); border-radius: var(--r-xl); min-height: 0; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.pane-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 14px 10px 16px; }
.pane-head h2 { font-size: var(--fs-md); font-weight: 800; display: flex; align-items: center; gap: 8px; }
.pane-head h2 svg { width: 18px; height: 18px; color: var(--accent-2); }
.pane-body { flex: 1; overflow: auto; padding: 4px 12px 14px; min-height: 0; }
.ed-lib { grid-area: lib; }
.ed-center { grid-area: center; }
.ed-props { grid-area: props; }
.ed-tl { grid-area: tl; }
.rz { position: relative; cursor: col-resize; touch-action: none; }
.rz::after { content: ""; position: absolute; inset: 30% 2px; border-radius: 4px; background: transparent; transition: background var(--dur-1); }
.rz:hover::after, .rz.active::after { background: var(--accent); }
.rz-l { grid-area: rl; }
.rz-r { grid-area: rr; }
.rz-t { grid-area: rt; cursor: row-resize; }
.rz-t::after { inset: 2px 45%; }

.lib-add { width: 100%; }
.lib-list { display: grid; gap: 8px; margin-top: 12px; }
.lib-item { position: relative; display: grid; grid-template-columns: 92px 1fr; gap: 10px; align-items: center; padding: 6px; border-radius: var(--r-md); border: 1px solid transparent; cursor: grab; transition: background var(--dur-1), border-color var(--dur-1); touch-action: none; user-select: none; }
.lib-item:hover, .lib-item:focus-visible { background: var(--accent-soft); border-color: var(--border); }
.lib-item .lt { position: relative; width: 92px; aspect-ratio: 16/10; border-radius: 8px; overflow: hidden; background: var(--stage-bg); }
.lib-item .lt canvas { width: 100%; height: 100%; object-fit: cover; }
.lib-item .lt .dur { position: absolute; right: 4px; bottom: 4px; font-size: 10.5px; font-weight: 700; padding: 1px 5px; border-radius: 5px; background: rgba(8, 5, 22, 0.72); color: #fff; }
.lib-item .lt .used { position: absolute; left: 4px; top: 4px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; }
.lib-item .lt .used svg { width: 11px; height: 11px; }
.lib-item .li { min-width: 0; }
.lib-item .li b { display: block; font-size: var(--fs-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lib-item .li span { display: block; font-size: 11.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lib-item .li .badge { margin-top: 4px; height: 19px; font-size: 10.5px; }
.lib-item .la { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); display: flex; gap: 4px; padding: 4px 4px 4px 22px; border-radius: 10px; background: linear-gradient(90deg, transparent, var(--surface-2) 30%); opacity: 0; pointer-events: none; transition: opacity var(--dur-1); }
.lib-item:hover .la, .lib-item:focus-within .la { pointer-events: auto; }
.lib-item:hover .la, .lib-item:focus-within .la, .lib-item .la:focus-within { opacity: 1; }
.lib-item.loading { cursor: progress; }
.lib-item.err { cursor: default; }
.lib-item.missing .lt { opacity: 0.4; }
.lib-drop { margin-top: 10px; padding: 14px; border: 1.5px dashed var(--border-strong); border-radius: var(--r-md); text-align: center; color: var(--text-3); font-size: var(--fs-xs); }

.stage-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; flex-wrap: wrap; }
.stage { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; padding: 6px 14px; }
.stage-frame { position: relative; background: #000; border-radius: 10px; box-shadow: 0 0 0 1px var(--border-strong), 0 20px 60px -20px rgba(0,0,0,0.6); overflow: hidden; }
.stage-frame canvas { width: 100%; height: 100%; display: block; }
.stage-frame.pannable { cursor: grab; }
.stage-frame.panning { cursor: grabbing; }
.stage-empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: rgba(255,255,255,0.72); font-size: var(--fs-sm); padding: 16px; pointer-events: none; }
.stage-empty svg { width: 36px; height: 36px; margin: 0 auto 8px; opacity: 0.7; }
.stage-busy { position: absolute; right: 10px; top: 10px; color: #fff; opacity: 0.85; }
.stage:fullscreen { background: #000; padding: 0; }
.stage:fullscreen .stage-frame { border-radius: 0; box-shadow: none; }
.vpool { position: absolute; width: 2px; height: 2px; overflow: hidden; opacity: 0; pointer-events: none; left: 0; top: 0; }
.transport { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 8px 14px 12px; }
.transport .tc { font-size: var(--fs-md); font-weight: 700; }
.transport .tc span { color: var(--text-3); font-weight: 600; }
.transport .ctr { display: flex; align-items: center; gap: 4px; }
.transport .right { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.btn-play { --h: 46px; width: 46px; border-radius: 50%; padding: 0; }
.btn-play svg { width: 20px; height: 20px; }
.vol { display: flex; align-items: center; gap: 6px; width: 140px; }

.props-sec { padding: 12px 4px; border-bottom: 1px solid var(--border); display: grid; gap: 10px; }
.props-sec:last-child { border-bottom: 0; }
.props-sec h3 { font-size: var(--fs-sm); font-weight: 800; color: var(--text-2); }
.props-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: var(--fs-sm); }
.props-row .v { color: var(--text-2); font-weight: 600; }
.props-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.props-actions .full { grid-column: 1 / -1; }

.tl-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.tl-bar .group { display: flex; gap: 2px; padding: 3px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--border); }
.tl-bar .group .btn { --h: 32px; }
.tl-bar .grow { flex: 1; }
.zoom { display: flex; align-items: center; gap: 6px; width: 220px; }
.tl-body { position: relative; flex: 1; min-height: 0; display: flex; }
.tl-heads { width: 54px; flex: none; border-right: 1px solid var(--border); display: grid; grid-template-rows: 30px 1fr; }
.tl-heads .th { display: grid; place-items: center; color: var(--text-3); }
.tl-heads .th svg { width: 18px; height: 18px; }
.tl-scroll { position: relative; flex: 1; overflow-x: auto; overflow-y: hidden; min-width: 0; }
.tl-inner { position: relative; height: 100%; min-width: 100%; }
.tl-ruler { position: sticky; top: 0; height: 30px; cursor: pointer; }
.tl-ruler canvas { position: absolute; top: 0; height: 30px; }
.tl-track { position: absolute; top: 42px; left: 0; right: 0; height: calc(100% - 58px); min-height: 70px; max-height: 150px; }
.tl-track .lane { position: absolute; inset: 0; border-radius: var(--r-md); background: var(--track-bg); }
.tl-empty { position: absolute; inset: 0; border-radius: var(--r-md); border: 1.5px dashed var(--border-strong); display: grid; place-items: center; color: var(--text-3); font-size: var(--fs-md); font-weight: 600; pointer-events: none; padding: 0 12px; text-align: center; }
.tl-empty.over, .tl-track.over .lane { border-color: var(--accent); background: var(--accent-soft); }
.clip { position: absolute; top: 0; height: 100%; border-radius: 10px; overflow: hidden; background: linear-gradient(180deg, var(--clip-a), var(--clip-b)); border: 2px solid rgba(255,255,255,0.08); cursor: grab; touch-action: none; user-select: none; box-shadow: inset 0 1px 0 rgba(255,255,255,0.2); outline: none; }
.clip canvas.strip { position: absolute; top: 0; height: 100%; pointer-events: none; }
.clip .cl-label { position: absolute; left: 6px; top: 5px; max-width: calc(100% - 12px); display: flex; gap: 6px; align-items: center; font-size: 11px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.7); white-space: nowrap; overflow: hidden; pointer-events: none; }
.clip .cl-label span { overflow: hidden; text-overflow: ellipsis; }
.clip .cl-label em { font-style: normal; font-weight: 600; opacity: 0.85; }
.clip .cl-label svg { width: 12px; height: 12px; flex: none; }
.clip.sel { border-color: #fff; box-shadow: 0 0 0 2px var(--accent), 0 0 22px var(--accent-glow); z-index: 2; }
.clip:focus-visible { border-color: #fff; box-shadow: 0 0 0 3px var(--accent-2); }
.clip.dragging { opacity: 0.35; }
.clip.trimming { z-index: 3; }
.clip.missing { background: repeating-linear-gradient(45deg, #3a2f5e, #3a2f5e 8px, #2a2148 8px, #2a2148 16px); }
.clip .h { position: absolute; top: 0; bottom: 0; width: 12px; cursor: ew-resize; z-index: 2; display: grid; place-items: center; }
.clip .h::before { content: ""; width: 4px; height: 26px; max-height: 50%; border-radius: 4px; background: rgba(255,255,255,0.9); box-shadow: 0 0 4px rgba(0,0,0,0.5); opacity: 0; transition: opacity var(--dur-1); }
.clip:hover .h::before, .clip.sel .h::before, .clip.trimming .h::before { opacity: 1; }
.clip .h.l { left: 0; }
.clip .h.r { right: 0; }
.trim-tip { position: absolute; top: -30px; z-index: 6; transform: translateX(-50%); padding: 3px 8px; border-radius: 6px; background: #221c44; color: #fff; font-size: 11.5px; font-weight: 700; white-space: nowrap; pointer-events: none; }
.playhead { position: absolute; top: 0; bottom: 0; width: 0; z-index: 5; pointer-events: none; }
.playhead::before { content: ""; position: absolute; top: 0; bottom: 0; left: -1px; width: 2px; background: #fff; box-shadow: 0 0 8px var(--accent-glow), 0 0 0 1px rgba(0,0,0,0.25); }
:root[data-ui="light"] .playhead::before { background: var(--accent); }
.playhead .knob { position: absolute; top: 2px; left: -8px; width: 16px; height: 20px; border-radius: 5px 5px 8px 8px; background: var(--accent); border: 2px solid #fff; pointer-events: auto; cursor: ew-resize; touch-action: none; }
.insert-mark { position: absolute; top: 34px; bottom: 6px; width: 4px; margin-left: -2px; border-radius: 4px; background: #fff; box-shadow: 0 0 12px var(--accent), 0 0 0 2px var(--accent); z-index: 6; pointer-events: none; }
.drag-ghost { position: fixed; z-index: 120; pointer-events: none; height: 56px; min-width: 60px; max-width: 280px; border-radius: 10px; background: linear-gradient(180deg, var(--clip-a), var(--clip-b)); border: 2px solid #fff; box-shadow: 0 20px 40px -10px rgba(0,0,0,0.55), 0 0 24px var(--accent-glow); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: flex-end; padding: 6px 8px; transform: rotate(-1.5deg) scale(1.03); overflow: hidden; white-space: nowrap; }
.drop-overlay { position: fixed; inset: 10px; z-index: 110; border-radius: 26px; border: 2px dashed var(--accent); background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(4px); display: grid; place-items: center; pointer-events: none; }
.drop-overlay div { text-align: center; font-size: var(--fs-xl); font-weight: 800; }
.drop-overlay svg { width: 56px; height: 56px; margin: 0 auto 12px; color: var(--accent-2); }
.tip-slot { flex: 1; display: flex; justify-content: center; min-width: 0; }
.tip-bubble { display: flex; gap: 8px; align-items: center; max-width: 600px; min-width: 0; padding: 4px 4px 4px 12px; border-radius: var(--r-md); background: var(--accent-soft); border: 1px solid var(--accent); box-shadow: 0 0 22px -8px var(--accent-glow); font-size: var(--fs-sm); font-weight: 600; animation: pop var(--dur-3) var(--ease); }
.tip-bubble svg { width: 17px; height: 17px; color: var(--accent-2); flex: none; }
.tip-bubble p { flex: 1; }

/* ---------- Tutorial ---------- */
.tour-shade { position: fixed; inset: 0; z-index: 130; pointer-events: auto; }
.tour-spot { position: fixed; z-index: 131; border-radius: 14px; box-shadow: 0 0 0 9999px rgba(8, 5, 22, 0.68), 0 0 0 2px var(--accent), 0 0 30px var(--accent-glow); pointer-events: none; transition: all var(--dur-3) var(--ease); }
.tour-pop { position: fixed; z-index: 132; width: min(360px, calc(100vw - 32px)); padding: 20px; border-radius: var(--r-xl); background: var(--surface); border: 1px solid var(--border-strong); box-shadow: var(--shadow-3); animation: pop var(--dur-3) var(--ease); }
.tour-pop .step { font-size: var(--fs-xs); font-weight: 700; color: var(--accent-2); }
.tour-pop h3 { font-size: var(--fs-lg); margin: 6px 0 8px; }
.tour-pop p { color: var(--text-2); font-size: var(--fs-md); }
.tour-pop .dots { display: flex; gap: 5px; }
.tour-pop .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--surface-3); }
.tour-pop .dots i.on { background: var(--accent); width: 18px; border-radius: 6px; }
.tour-pop .foot { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
.tour-pop .foot .grow { flex: 1; }

/* ---------- Esportazione ---------- */
.presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.preset { text-align: left; padding: 14px; border-radius: var(--r-lg); border: 1.5px solid var(--border); background: var(--surface-2); cursor: pointer; display: grid; gap: 6px; transition: border-color var(--dur-1), background var(--dur-1); color: var(--text); }
.preset:hover { border-color: var(--border-strong); }
.preset[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px var(--accent-soft); }
.preset .pi { display: flex; align-items: center; justify-content: space-between; }
.preset .pi svg { width: 22px; height: 22px; color: var(--accent-2); }
.preset b { font-size: var(--fs-md); }
.preset span { font-size: var(--fs-xs); color: var(--text-3); }
.exp-grid { display: grid; grid-template-columns: 220px 1fr; gap: 20px; align-items: start; }
.exp-prev { border-radius: var(--r-md); overflow: hidden; background: #000; display: grid; place-items: center; aspect-ratio: 1; }
.exp-prev canvas { max-height: 100%; width: auto; }
.adv summary { cursor: pointer; font-weight: 700; font-size: var(--fs-md); color: var(--text-2); padding: 4px 0; }
.adv .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 12px; }
.sum-line { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: var(--fs-sm); color: var(--text-2); }
.sum-line b { color: var(--text); }
.stages { display: grid; gap: 8px; }
.stages div { display: flex; align-items: center; gap: 10px; font-size: var(--fs-md); color: var(--text-3); }
.stages div.on { color: var(--text); font-weight: 700; }
.stages div.done { color: var(--success); }
.stages svg { width: 18px; height: 18px; }
.result-video { width: 100%; max-height: 300px; border-radius: var(--r-md); background: #000; }

/* =========================================================================
   WORKFLOW PRO (stile DaVinci Resolve): Media Pool, multitraccia, Inspector
   Solo token esistenti: superfici, bordi, accento, stati.
   ========================================================================= */
.invisible { visibility: hidden; }
.btn-xs { --h: 24px; padding: 0 6px; font-size: var(--fs-xs); border-radius: var(--r-xs); }
.btn-xs.btn-icon { width: 24px; padding: 0; }
.btn-xs svg { width: 14px; height: 14px; }
.select-sm { height: 30px; padding: 0 28px 0 8px; font-size: var(--fs-xs); border-radius: var(--r-sm); background-position: calc(100% - 13px) 12px, calc(100% - 9px) 12px; }
.seg button svg { width: 15px; height: 15px; }

/* ---------- Media Pool ---------- */
.lib-filter { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; margin-top: 12px; }
.lib-filter button { padding: 0 4px; gap: 4px; height: 34px; font-size: 11.5px; justify-content: center; min-width: 0; }
.lib-filter button span { overflow: hidden; text-overflow: ellipsis; }
.lib-filter button small { font-size: 10px; opacity: 0.75; }
.lib-filter button svg { display: none; }
.lib-item .lt .kind { position: absolute; left: 4px; bottom: 4px; width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; background: rgba(8, 5, 22, 0.72); color: #fff; }
.lib-item .lt .kind svg { width: 12px; height: 12px; }
.lib-item.k-audio .lt { background: color-mix(in srgb, var(--success) 10%, var(--stage-bg)); }
.lib-none { margin-top: 12px; text-align: center; }

/* ---------- Anteprima: strumenti ---------- */
.stage-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.mini-field { display: inline-flex; align-items: center; gap: 4px; color: var(--text-3); }
.mini-field > svg { width: 15px; height: 15px; }
.stage-badge { position: absolute; left: 10px; top: 10px; padding: 4px 10px; border-radius: var(--r-pill); background: rgba(8, 5, 22, 0.78); color: #fff; font-size: var(--fs-xs); font-weight: 700; border: 1px solid var(--accent); pointer-events: none; }

/* ---------- Timeline multitraccia ---------- */
.ed { --tl-h: 330px; }
.tl-bar .tools { gap: 2px; }
.tl-bar .tools .btn[aria-checked="true"] { background: var(--grad); color: #fff; }
.tl-heads { width: 54px; display: grid; grid-template-rows: 30px 44px minmax(56px, 1fr) 48px; row-gap: 6px; padding-bottom: 8px; }
.tl-heads .th { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--text-3); border-radius: var(--r-sm); }
.tl-heads .th b { font-size: 10.5px; font-weight: 800; letter-spacing: 0.04em; }
.tl-heads .th svg { width: 16px; height: 16px; }
.tl-heads .th-v1 { color: var(--accent-2); }
.tl-heads .th-a1 { color: var(--success); }
.tl-lanes { position: absolute; left: 0; right: 0; top: 36px; bottom: 8px; display: grid; grid-template-rows: 44px minmax(56px, 1fr) 48px; row-gap: 6px; }
.tl-lanes .tl-track { position: relative; inset: auto; top: auto; height: auto; min-height: 0; max-height: none; }
.tl-lanes .lane-v1 { grid-row: 2; }
.tl-lanes .lane-v2 { grid-row: 1; }
.tl-lanes .lane-a1 { grid-row: 3; }
.tl-lanes .lane-v2 .lane, .tl-lanes .lane-a1 .lane { opacity: 0.75; }
.tl-lanes .tl-track.over .lane { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); opacity: 1; }
.clip .cl-label svg.hidden { display: none; }
.clip.k-image { background: linear-gradient(180deg, var(--accent-2), var(--clip-b)); }
.clip.k-text { background: linear-gradient(180deg, color-mix(in srgb, var(--warning) 70%, var(--surface)), color-mix(in srgb, var(--warning) 45%, var(--surface-3))); }
.clip.k-adjust { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--accent-2) 55%, var(--surface)) 0 10px, color-mix(in srgb, var(--accent) 45%, var(--surface)) 10px 20px); }
.lane-a1 .clip { background: linear-gradient(180deg, color-mix(in srgb, var(--success) 55%, var(--surface)), color-mix(in srgb, var(--success) 30%, var(--surface-3))); }
/* tema chiaro: tinte più piene, il testo bianco delle etichette resta leggibile */
:root[data-ui="light"] .lane-a1 .clip { background: linear-gradient(180deg, var(--success), color-mix(in srgb, var(--success) 72%, var(--text))); }
:root[data-ui="light"] .clip.k-text { background: linear-gradient(180deg, var(--warning), color-mix(in srgb, var(--warning) 72%, var(--text))); }
:root[data-ui="light"] .clip.k-adjust { background: repeating-linear-gradient(135deg, var(--accent) 0 10px, color-mix(in srgb, var(--accent) 75%, var(--text)) 10px 20px); }
.clip.k-text .cl-label, .clip.k-adjust .cl-label { top: 50%; transform: translateY(-50%); }
.clip[data-label]::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: var(--lbl); pointer-events: none; z-index: 1; }
.clip.disabled { opacity: 0.42; filter: grayscale(0.8); }
.clip.disabled::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(45deg, transparent 0 8px, rgba(0, 0, 0, 0.28) 8px 16px); pointer-events: none; z-index: 1; }
.clip.moving { z-index: 4; box-shadow: 0 10px 24px -8px rgba(0, 0, 0, 0.6), 0 0 0 2px var(--accent); }
.clip.invalid { box-shadow: 0 0 0 2px var(--danger); opacity: 0.7; }
.clip.slipping { box-shadow: 0 0 0 2px var(--warning); }
.tl-scroll[data-tool="blade"] .clip, .tl-scroll[data-tool="blade"] .clip .h { cursor: crosshair; }
.tl-scroll[data-tool="slip"] .clip { cursor: col-resize; }
.blade-line { position: absolute; width: 2px; margin-left: -1px; background: var(--danger); box-shadow: 0 0 8px var(--danger); z-index: 7; pointer-events: none; }
.blade-line::before { content: ""; position: absolute; top: -6px; left: -4px; border: 5px solid transparent; border-top-color: var(--danger); }
/* marker */
.tl-markers { position: absolute; left: 0; right: 0; top: 0; height: 0; z-index: 6; }
.mk { position: absolute; top: 2px; width: 12px; height: 14px; margin-left: -6px; padding: 0; border: 0; border-radius: 3px 3px 0 0; background: var(--mk); clip-path: polygon(0 0, 100% 0, 100% 65%, 50% 100%, 0 65%); cursor: pointer; }
.mk::after { content: ""; position: absolute; left: 5.5px; top: 14px; width: 1px; height: 600px; background: var(--mk); opacity: 0.45; pointer-events: none; }
.mk { overflow: visible; clip-path: none; }
.mk::before { content: ""; position: absolute; inset: 0; background: var(--mk); clip-path: polygon(0 0, 100% 0, 100% 65%, 50% 100%, 0 65%); border-radius: 3px 3px 0 0; }
.mk { background: transparent; }
.mk:hover::before, .mk:focus-visible::before { filter: brightness(1.25); }
.cmks { position: absolute; left: 0; right: 0; top: 0; height: 0; z-index: 3; }
.cmk { position: absolute; top: 3px; width: 10px; height: 10px; margin-left: -5px; padding: 0; border: 1.5px solid #fff; border-radius: 2px; background: var(--mk); transform: rotate(45deg); cursor: pointer; }

/* ---------- Inspector ---------- */
.ed-props .pane-body { scroll-padding-top: 70px; }
.insp-name { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.insp-name b { word-break: break-word; font-size: var(--fs-sm); }
.insp-tabs { position: sticky; top: -4px; z-index: 2; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; padding: 3px; margin: 10px 0 4px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--border); }
.insp-tabs [role="tab"] { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--text-2); font-size: 11.5px; font-weight: 700; cursor: pointer; }
.insp-tabs [role="tab"] svg { width: 16px; height: 16px; }
.insp-tabs [role="tab"]:hover { background: var(--accent-soft); color: var(--text); }
.insp-tabs [role="tab"][aria-selected="true"] { background: var(--grad); color: #fff; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ctl { display: grid; gap: 2px; }
.ctl-head { display: grid; grid-template-columns: 1fr auto 24px; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--text-2); }
.ctl-head label { cursor: default; user-select: none; }
.ctl-val { display: inline-flex; align-items: center; gap: 3px; }
.input.num { width: 64px; height: 26px; padding: 0 6px; font-size: var(--fs-xs); text-align: right; border-radius: var(--r-xs); }
.input.num-wide { width: 96px; }
.ctl-val .unit { font-size: var(--fs-xs); color: var(--text-3); min-width: 10px; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.btn-row .btn { min-width: 0; }
.btn-row .btn span { overflow: hidden; text-overflow: ellipsis; }
.seg-full { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; width: 100%; }
.seg-wrap { grid-auto-flow: row; grid-template-columns: repeat(3, 1fr); }
.seg-full button { justify-content: center; padding: 0 4px; }
.props-sec .btn.full { width: 100%; }
.props-sec .kbd { margin-left: auto; height: 19px; font-size: 10.5px; }
.text-area { height: auto; min-height: 70px; padding: 8px 10px; resize: vertical; line-height: 1.4; }
.ctl-inline { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: end; }
.color-in { width: 46px; height: 32px; padding: 2px; border-radius: var(--r-sm); border: 1px solid var(--border-strong); background: var(--surface-2); cursor: pointer; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.swatches .sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border-strong); background: var(--sw); cursor: pointer; padding: 0; display: grid; place-items: center; color: var(--text-3); }
.swatches .sw.none { background: transparent; }
.swatches .sw svg { width: 14px; height: 14px; }
.swatches .sw[aria-checked="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent-2); border-color: transparent; }
.hint.pad { padding: 8px 4px; }
.props-actions .btn { min-width: 0; }

/* ---------- Menu e finestre ---------- */
.menu .swatch { width: 14px; height: 14px; border-radius: 50%; background: var(--sw); flex: none; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25); }
.menu .menu-ic-gap { width: 17px; flex: none; }
.attr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.attr-grid > .btn { grid-column: 1 / -1; justify-self: start; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface-2); cursor: pointer; }
.check:hover { border-color: var(--border-strong); }
.check input { margin-top: 3px; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
.check b { display: block; font-size: var(--fs-md); }
.check small { display: block; color: var(--text-3); font-size: var(--fs-xs); line-height: 1.35; }
.set-list { display: grid; gap: 4px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.set-row:last-child { border-bottom: 0; }
.set-row > div:first-child { display: grid; gap: 2px; max-width: 46ch; }
.set-row b { font-size: var(--fs-md); }
.set-row span { font-size: var(--fs-sm); color: var(--text-3); }
.set-ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.short-group { grid-column: 1 / -1; font-size: var(--fs-sm); font-weight: 800; color: var(--accent-2); margin-top: 12px; }
.short-group:first-child { margin-top: 0; }

/* ---------- Project Manager ---------- */
.dash-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.search-field { position: relative; display: inline-flex; align-items: center; }
.search-field svg { position: absolute; left: 11px; width: 17px; height: 17px; color: var(--text-3); pointer-events: none; }
.search-field .input { padding-left: 36px; width: 240px; }
.sort-field .select { width: 180px; }

/* anteprima stretta (pannelli laterali aperti su schermi piccoli) */
.ed-center { container-type: inline-size; container-name: center; }
.transport .tc { white-space: nowrap; }
@container center (max-width: 640px) {
  .stage-bar .seg button small { display: none; }
  .stage-tools .mini-field > svg { display: none; }
  .stage-bar { padding: 8px 10px; gap: 6px; }
  .transport { gap: 6px; padding: 6px 10px 10px; }
  .transport .tc { font-size: var(--fs-sm); }
  .transport .vol { width: 92px; }
}
@container center (max-width: 470px) {
  .transport { grid-template-columns: auto 1fr auto; }
  .transport .vol .range { display: none; }
  .transport .vol { width: auto; }
  .transport .ctr .btn-icon:first-child, .transport .ctr .btn-icon:last-child { display: none; }
}
@media (max-width: 1280px) {
  .tl-bar .btn .lbl { display: none; }
  .tl-bar .btn:has(.lbl) { width: var(--h); padding: 0; }
  .zoom { width: 160px; }
}
@media (max-width: 1100px) {
  .stage-tools .mini-field > svg { display: none; }
}

/* ---------- Responsive ---------- */
@media (max-width: 1100px) {
  .lp-hero { grid-template-columns: 1fr; padding-top: 48px; }
  .hero-art { max-width: 560px; }
  .steps { grid-template-columns: 1fr; }
  .dash-hero { grid-template-columns: 1fr; }
  .dash-hero .art { display: none; }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; padding: 10px; }
  .sidebar { flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px; gap: 4px; }
  .sidebar .logo { padding: 0 8px 0 4px; }
  .sidebar .sep, .sidebar .grow, .sidebar .acct { display: none; }
  .nav-item { padding: 8px 10px; }
  .nav-item .lbl { display: none; }
  .benefits { grid-template-columns: 1fr; }
  .benefits > div:nth-child(odd) { padding-right: 8px; border-right: 0; }
  .benefits > div:nth-child(even) { padding-left: 0; }
  .lp-nav nav { display: none; }
  .lp-nav .in { justify-content: space-between; }
  .exp-grid { grid-template-columns: 1fr; }
  .exp-prev { max-width: 220px; }
}
@media (max-width: 760px) {
  .ed-wrap > .ed { display: none; }
  .gate { display: grid; place-items: center; min-height: 100%; padding: 32px 24px; text-align: center; }
  .gate .in { max-width: 380px; display: grid; gap: 14px; justify-items: center; }
  .gate svg.big { width: 92px; height: 92px; }
  .gate h1 { font-size: var(--fs-2xl); }
  .gate p { color: var(--text-2); }
}

/* ---------- Struttura pagina ---------- */
#app { height: 100%; }
#main:focus, #main:focus-visible { outline: none; }
html.is-editor body { overflow: hidden; }
/* nell'editor i messaggi compaiono in alto, per non coprire la timeline */
html.is-editor .toasts { bottom: auto; top: calc(66px + env(safe-area-inset-top, 0px)); }
/* nell'editor al massimo due messaggi visibili: l'anteprima resta libera */
html.is-editor .toasts .toast:nth-last-child(n+3) { display: none; }
.skip { position: fixed; left: 12px; top: 12px; z-index: 200; transform: translateY(-160%); transition: transform var(--dur-2) var(--ease); }
.skip:focus { transform: none; }

</style>

  'help.title': ['Centro assistenza', 'Help center'], 'help.sub': ['Risposte rapide alle domande più comuni.', 'Quick answers to common questions.'], 'help.faq': ['Domande frequenti', 'Frequently asked questions'],
  'hfaq.q1': ['Come divido una clip?', 'How do I split a clip?'], 'hfaq.a1': ['Clicca sulla clip nel punto esatto in cui vuoi tagliare: il cursore si sposta lì. Poi premi S o il pulsante Dividi.', 'Click the clip exactly where you want to cut: the playhead moves there. Then press S or the Split button.'],
  'hfaq.q2': ['Come accorcio l’inizio o la fine?', 'How do I shorten the start or end?'], 'hfaq.a2': ['Passa il mouse su una clip e trascina la maniglia bianca sul bordo sinistro o destro. L’anteprima mostra il fotogramma esatto in cui taglierai.', 'Hover a clip and drag the white handle on its left or right edge. The preview shows the exact frame where you will cut.'],
  'hfaq.q3': ['Ho sbagliato, come torno indietro?', 'I made a mistake, how do I go back?'], 'hfaq.a3': ['Premi Ctrl+Z (⌘+Z su Mac) quante volte vuoi. Dal pulsante Cronologia puoi tornare direttamente a un passaggio precedente.', 'Press Ctrl+Z (⌘+Z on Mac) as many times as you like. The History button takes you straight back to an earlier step.'],
  'hfaq.q4': ['Le bande nere ai lati del video', 'Black bars around the video'], 'hfaq.a4': ['Succedono quando il video ha un formato diverso dal progetto. Seleziona la clip e scegli Riempi nelle proprietà, poi trascina l’anteprima per scegliere la parte da tenere.', 'They appear when the video has a different shape from the project. Select the clip, choose Fill in properties, then drag the preview to pick the part to keep.'],
  'hfaq.q5': ['Dove vengono salvati i miei video?', 'Where are my videos saved?'], 'hfaq.a5': ['Nel tuo browser, su questo computer. Non vengono caricati online. Se cancelli i dati del browser, i video vanno ricollegati.', 'In your browser, on this computer. They are not uploaded. If you clear browser data, you need to relink the videos.'],
  'hfaq.q6': ['Ho aperto il progetto su un altro computer e mancano i video', 'I opened the project on another computer and videos are missing'], 'hfaq.a6': ['È normale: i video non viaggiano con il progetto. Usa Ritrova i tuoi video e seleziona gli stessi file: tagli e ordine restano intatti.', 'That is expected: videos do not travel with the project. Use Find your videos and select the same files: cuts and order stay intact.'],
  'hfaq.q7': ['Un video non si apre', 'A video will not open'], 'hfaq.a7': ['Alcuni formati, come HEVC dell’iPhone, MKV o AVI, non sono leggibili da tutti i browser. Convertilo in MP4 (H.264) con un programma gratuito come HandBrake e riprova.', 'Some formats, such as iPhone HEVC, MKV or AVI, are not readable in every browser. Convert it to MP4 (H.264) with a free tool such as HandBrake and try again.'],
  'hfaq.q8': ['Quanto dura l’esportazione?', 'How long does exporting take?'], 'hfaq.a8': ['Circa quanto il video. Tieni la scheda aperta e visibile: se la nascondi l’esportazione va in pausa e riprende quando torni.', 'About as long as the video. Keep the tab open and visible: if you hide it, the export pauses and resumes when you come back.'],
  'hfaq.q9': ['L’audio esportato non si sente su alcuni lettori', 'The exported audio does not play in some players'], 'hfaq.a9': ['Su Linux il browser crea l’audio in formato Opus, che alcuni lettori Apple non supportano. Esporta da Chrome o Edge su Windows o Mac per avere audio AAC.', 'On Linux the browser creates Opus audio, which some Apple players do not support. Export from Chrome or Edge on Windows or Mac to get AAC audio.'],
